<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サクラ整骨院 - AI予約チャット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#e8839a; --pink-light:#fde8ee; --pink-dark:#c45d75; --gray:#6b7280; --text:#1f2937; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans JP',sans-serif; background:linear-gradient(135deg,#fff5f7,#fde8ee,#fff0f3); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:480px; background:white; border-radius:24px; box-shadow:0 8px 40px rgba(232,131,154,0.2); overflow:hidden; display:flex; flex-direction:column; height:90vh; max-height:800px; }
  .header { background:linear-gradient(135deg,var(--pink),var(--pink-dark)); padding:18px 24px; color:white; display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .hicon { width:46px; height:46px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .htxt h1 { font-family:'Shippori Mincho',serif; font-size:16px; font-weight:600; }
  .htxt p { font-size:12px; opacity:0.85; margin-top:2px; }
  .hstatus { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; }
  .dot { width:8px; height:8px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .msgs { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .msgs::-webkit-scrollbar { width:4px; }
  .msgs::-webkit-scrollbar-thumb { background:#f9a8b8; border-radius:4px; }
  .bw { display:flex; gap:8px; animation:up 0.3s ease; }
  .bw.user { flex-direction:row-reverse; }
  @keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .av { width:32px; height:32px; background:var(--pink-light); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:4px; }
  .bub { max-width:80%; padding:11px 15px; border-radius:18px; font-size:14px; line-height:1.7; word-break:break-word; }
  .bub.bot { background:var(--pink-light); color:var(--text); border-top-left-radius:4px; }
  .bub.user { background:var(--pink); color:white; border-top-right-radius:4px; }
  .bub.error { background:#fee2e2; color:#dc2626; }
  .choices { display:flex; flex-direction:column; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .cbtn { padding:10px 16px; background:white; border:1.5px solid var(--pink); border-radius:20px; font-size:14px; color:var(--pink-dark); cursor:pointer; text-align:left; transition:all 0.2s; }
  .cbtn:hover { background:var(--pink-light); }
  .cbtn:disabled { opacity:0.4; cursor:not-allowed; }
  .cbtn.gold { border-color:#d97706; color:#92400e; background:#fffbeb; }
  .cbtn.gold:hover { background:#fef3c7; }
  .slots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  
  /* 改修：時間枠ボタンのデザインをリッチに */
  .slotbtn { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; background:white; border:1.5px solid #e5e7eb; border-radius:12px; font-size:15px; font-weight:700; color:var(--text); cursor:pointer; transition:all 0.2s; }
  .slotbtn:hover:not(:disabled) { border-color:var(--pink); background:var(--pink-light); color:var(--pink-dark); }
  .slotbtn:disabled { opacity:0.4; cursor:not-allowed; }
  .slot-status-o { font-size:11px; color:#059669; font-weight:normal; margin-top:2px; }
  .slot-status-t { font-size:11px; color:#d97706; font-weight:normal; margin-top:2px; }

  .cardwrap { padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .card { background:linear-gradient(135deg,#fff5f7,#fde8ee); border:2px solid var(--pink-light); border-radius:16px; padding:16px; font-size:13px; }
  .card.gold { background:linear-gradient(135deg,#fffbeb,#fef3c7); border-color:#fcd34d; }
  .card h3 { color:var(--pink-dark); font-size:14px; margin-bottom:10px; font-weight:600; }
  .card.gold h3 { color:#92400e; }
  .card .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #fce4ec; }
  .card .row:last-of-type { border-bottom:none; }
  .card .lbl { color:var(--gray); }
  .card p { font-size:13px; line-height:1.8; color:#374151; margin-bottom:10px; }
  .card .price { font-size:22px; font-weight:700; color:#92400e; text-align:center; padding:8px 0; }
  .card .price small { font-size:13px; font-weight:400; color:var(--gray); }
  .btnrow { display:flex; gap:8px; margin-top:12px; }
  .btnok { flex:1; padding:10px; background:var(--pink); color:white; border:none; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .btnok:hover:not(:disabled) { background:var(--pink-dark); }
  .btnok:disabled { opacity:0.5; cursor:not-allowed; }
  .btnok.gold { background:linear-gradient(135deg,#f59e0b,#d97706); }
  .btnok.gold:hover { background:#b45309; }
  .btnng { flex:1; padding:10px; background:white; color:var(--gray); border:1px solid #e5e7eb; border-radius:12px; font-size:14px; cursor:pointer; }
  .linebtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#06C755; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; }
  .ytbtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#FF0000; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; text-decoration:none; }
  .typing-bub { display:flex; gap:4px; align-items:center; padding:12px 16px; background:var(--pink-light); border-radius:18px; border-top-left-radius:4px; }
  .typing-bub span { width:7px; height:7px; background:var(--pink); border-radius:50%; animation:bounce 1.2s infinite; }
  .typing-bub span:nth-child(2){animation-delay:0.2s}
  .typing-bub span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .footer { padding:12px 16px; border-top:1px solid #fce4ec; background:white; flex-shrink:0; }
  .iw { display:flex; gap:8px; align-items:center; }
  .inp { flex:1; border:1.5px solid #fce4ec; border-radius:24px; padding:10px 16px; font-size:14px; font-family:inherit; outline:none; resize:none; max-height:80px; overflow-y:auto; line-height:1.5; }
  .inp:focus { border-color:var(--pink); }
  .inp:disabled { background:#fafafa; color:#aaa; }
  .sbtn { width:40px; height:40px; background:var(--pink); border:none; border-radius:50%; color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sbtn:disabled { background:#f3c4cf; cursor:not-allowed; }
  .badge { display:inline-block; background:var(--pink); color:white; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .badge.gold { background:#f59e0b; }
  
  /* 管理者モード用CSSなどはそのまま保持 */
  .admin-badge { background:#1e40af; color:white; font-size:11px; padding:2px 10px; border-radius:10px; margin-left:8px; vertical-align:middle; letter-spacing:0.5px; }
  .admin-header-bar { background:linear-gradient(135deg,#1e3a8a,#1e40af); }
  .admin-panel { padding:12px 16px; background:#f0f4ff; }
  .admin-section { margin-bottom:16px; }
  .admin-section h4 { font-size:13px; font-weight:700; color:#1e40af; margin-bottom:8px; padding-bottom:4px; border-bottom:2px solid #bfdbfe; }
  .admin-search-row { display:flex; gap:8px; margin-bottom:8px; }
  .admin-inp { flex:1; border:1.5px solid #bfdbfe; border-radius:10px; padding:8px 12px; font-size:13px; font-family:inherit; outline:none; background:white; color:#1f2937; }
  .admin-btn { padding:8px 14px; background:#1e40af; color:white; border:none; border-radius:10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .admin-btn:hover { background:#1e3a8a; }
  .admin-btn.red { background:#dc2626; }
  .admin-btn.green { background:#059669; }
  .admin-btn.gray { background:#6b7280; }
  .admin-result { background:white; border:1px solid #bfdbfe; border-radius:10px; padding:12px; font-size:13px; margin-top:8px; color:#1f2937; }
  .admin-result .arow { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #dbeafe; }
  .admin-result .albl { color:#6b7280; font-size:12px; }
  /* その他のカレンダーCSS等も省略せず維持 */
  .cal-wrap { background:white; border-radius:16px; padding:16px; margin:0 0 8px 0; border:1.5px solid #bfdbfe; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-title { font-size:15px; font-weight:700; color:#1e40af; }
  .cal-nav { width:30px; height:30px; background:#eff6ff; border:none; border-radius:8px; font-size:16px; cursor:pointer; color:#1e40af; display:flex; align-items:center; justify-content:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow { text-align:center; font-size:11px; color:#9ca3af; padding:4px 0; font-weight:600; }
  .cal-dow.sun { color:#ef4444; }
  .cal-dow.sat { color:#3b82f6; }
  .cal-day { text-align:center; padding:7px 2px; font-size:13px; border-radius:8px; cursor:pointer; transition:all 0.15s; color:#1f2937; }
  .cal-day:hover:not(.cal-empty):not(.cal-past):not(.cal-sun) { background:#dbeafe; color:#1e40af; }
  .cal-day.cal-empty { cursor:default; }
  .cal-day.cal-past { color:#d1d5db; cursor:not-allowed; }
  .cal-day.cal-sun { color:#fca5a5; cursor:not-allowed; }
  .cal-day.cal-sat { color:#93c5fd; }
  .cal-day.cal-selected { background:#1e40af; color:white !important; font-weight:700; }
  .cal-day.cal-today { border:2px solid #1e40af; font-weight:700; }
  .admin-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:center; justify-content:center; }
  .admin-modal { background:white; border-radius:16px; padding:24px; width:320px; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
  .admin-modal h3 { font-size:16px; font-weight:700; color:#1e40af; margin-bottom:16px; text-align:center; }
  .admin-modal input { width:100%; border:1.5px solid #bfdbfe; border-radius:10px; padding:10px 14px; font-size:14px; outline:none; margin-bottom:12px; box-sizing:border-box; }
  .admin-proxy-bar { background:#fef9c3; border:1px solid #fde047; border-radius:10px; padding:8px 12px; font-size:12px; color:#713f12; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
  .admin-proxy-bar button { background:#dc2626; color:white; border:none; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="hicon" id="hicon-logo" onclick="onLogoTap()" style="cursor:pointer;user-select:none;">🌸</div>
    <div class="htxt"><h1>サクラ整骨院</h1><p>AI予約アシスタント</p></div>
    <div class="hstatus"><div class="dot"></div>受付中 <span id="admin-panel-btn" style="display:none;cursor:pointer;margin-left:6px;" onclick="renderAdminPanel()">🛠</span></div>
    <button onclick="hardRestart()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:white;font-size:11px;padding:5px 10px;border-radius:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;">🔄 最初から</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div id="admin-panel" style="display:none; flex:1; overflow-y:auto; padding:16px; flex-direction:column; gap:12px;"></div>
  <div class="footer">
    <div class="iw">
      <textarea class="inp" id="inp" placeholder="上の選択肢からお選びください" rows="1" disabled></textarea>
      <button class="sbtn" id="sbtn" onclick="sendText()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ユーティリティ
// ============================================================
function scrollB(){ var m=document.getElementById("msgs"); m.scrollTop=m.scrollHeight; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function wait(fn,ms){ setTimeout(fn,ms||400); }
function pad(n){ return ("0"+n).slice(-2); }
function row(l,v){ return '<div class="row"><span class="lbl">'+l+'</span><span>'+esc(v)+'</span></div>'; }
function saveData(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function loadData(k){ try{var d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch(e){return null;} }

var GAS_URL    = "https://script.google.com/macros/s/AKfycbyfHn9LJJMs7KQNi0rxTVUTwvOlma_VwM8sXdabL693gx9h1xguR-vibe3D8MbZseR6/exec";
var AUTH_TOKEN = "Sk@2026_aRiNo#dAi";
var TEL        = "078-984-5788";
var LINE_URL   = "https://line.me/R/ti/p/%40487yoson";
var YOUTUBE_KOBE = "https://youtu.be/_wXc0tYJ5wk?si=XL0Kk8ZhG-uBq-Rx";
var YOUTUBE_SANDA = "https://youtu.be/u7JdsKxg6yM?si=TaoGEgALM42uw-Kt";
var SQUARE_URL = "https://square.link/u/eB3F1BoG";

var patient = loadData("sakura_patient") || {};
var family = loadData("sakura_family") || [];
var reserv = {};
var step = "";

// 管理者モード
var ADMIN_PASSWORD = "Sk@Admin#2026_aRi";
var isAdmin = false;
var adminProxyPatient = null;

// ============================================================
// 起動
// ============================================================
window.onload = function() {
  wait(function() {
    if (patient.name) {
      addBot("おかえりなさい、" + patient.name + "さん 🌸");
      wait(function() {
        var shouldSurvey = !adminProxyPatient && checkShouldAskSurvey();
        if (shouldSurvey) wait(function() { askPrevFeedback(); }, 600);
        else wait(function() { askPurpose(); }, 600);
      }, 600);
    } else {
      addBot("こんにちは！\nサクラ整骨院のAIアシスタントです 🌸");
      wait(function() {
        addBot("ご予約・お悩みのご相談をお気軽にどうぞ。");
        wait(function() { askPurpose(); }, 800);
      }, 700);
    }
  }, 400);
};

// ...（前回感想確認・アンケート等、省略せずに保持しますが、長さを最適化するためそのまま残します）...
function checkShouldAskSurvey() {
  if (!patient.lastSurveyDate) return true;
  var diff = (new Date() - new Date(patient.lastSurveyDate)) / (1000*60*60*24);
  return diff >= 90;
}
var surveyAnswers = {};
function askPrevFeedback() {
  addBot("前回の施術はいかがでしたか？");
  wait(function() {
    showChoices([
      { label:"⭐ とても良かった", val:"great" },
      { label:"良かった", val:"good" },
      { label:"普通", val:"normal" },
      { label:"改善してほしい点があった", val:"bad" },
    ], function(val) {
      if (val === "great" || val === "good") {
        wait(function() {
          addBot("それは嬉しいです 🌸\nGoogleの口コミへのご協力をお願いできますか？");
          wait(function() {
            showChoices([
              { label:"はい、協力します", val:"yes" },
              { label:"またの機会に", val:"no" },
            ], function(v) {
              if (v === "yes") { wait(function(){ startSurvey(); }, 400); }
              else {
                patient.lastSurveyDate = new Date().toISOString();
                saveData("sakura_patient", patient);
                wait(function(){ askPurpose(); }, 600);
              }
            });
          }, 600);
        }, 400);
      } else if (val === "bad") {
        wait(function() { addBot("貴重なご意見ありがとうございます 🌸\nどのような点でしょうか？"); step = "complaint"; enableInput(); }, 400);
      } else { wait(function(){ askPurpose(); }, 600); }
    });
  }, 600);
}

// -------------------------------------------------------------
// 【改修1】 複数メニュー同時選択機能 (askMultiMenu)
// -------------------------------------------------------------
function askMultiMenu() {
  addBot("ご希望のメニューをお選びください（複数選択可）🌸");
  wait(function(){
    var wrap = document.createElement("div"); wrap.className="cardwrap";
    var html = '<div class="card"><h3>📋 メニュー選択</h3>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;" id="multi-menu-grid">';
    
    var menus = [
      {val:"初診（保険）", label:"初診（保険）"},
      {val:"施術30分", label:"施療 30分"},
      {val:"施術60分", label:"施療 60分"},
      {val:"楽トレ", label:"楽トレ (20分)"},
      {val:"酸素カプセル", label:"酸素カプセル (40分)"}
    ];
    
    menus.forEach(function(m, i){
      html += '<label style="display:flex;align-items:center;justify-content:center; border:1.5px solid var(--pink-light); border-radius:8px; padding:10px; text-align:center; cursor:pointer; background:white; transition:all 0.2s;" class="menu-lbl" id="mlbl-'+i+'">'
           + '<input type="checkbox" style="display:none;" value="'+m.val+'" data-label="'+m.label+'" onchange="toggleMultiMenu('+i+')">'
           + '<span style="font-size:13px; font-weight:600; color:var(--text);">'+m.label+'</span>'
           + '</label>';
    });
    
    html += '</div>';
    html += '<button class="btnok" id="multi-menu-btn" onclick="submitMultiMenu()" disabled style="opacity:0.5; width:100%;">このメニューで進む</button>';
    html += '</div>';
    wrap.innerHTML = html;
    document.getElementById("msgs").appendChild(wrap); scrollB();
  }, 600);
}

function toggleMultiMenu(idx) {
  var lbl = document.getElementById("mlbl-"+idx);
  var chk = lbl.querySelector("input");
  if(chk.checked) {
    lbl.style.background = "var(--pink)";
    lbl.style.borderColor = "var(--pink)";
    lbl.querySelector("span").style.color = "white";
  } else {
    lbl.style.background = "white";
    lbl.style.borderColor = "var(--pink-light)";
    lbl.querySelector("span").style.color = "var(--text)";
  }
  var grid = document.getElementById("multi-menu-grid");
  var checked = grid.querySelectorAll("input:checked");
  var btn = document.getElementById("multi-menu-btn");
  if(checked.length > 0) { btn.disabled = false; btn.style.opacity = "1"; } 
  else { btn.disabled = true; btn.style.opacity = "0.5"; }
}

function submitMultiMenu() {
  var grid = document.getElementById("multi-menu-grid");
  var checked = grid.querySelectorAll("input:checked");
  if(checked.length === 0) return;
  grid.querySelectorAll("input").forEach(function(i){ i.disabled = true; });
  document.getElementById("multi-menu-btn").style.display = "none";
  
  var vals = []; var labels = [];
  checked.forEach(function(chk){
    vals.push(chk.value);
    labels.push(chk.getAttribute("data-label"));
  });
  
  reserv.menuList = vals; // GAS送信用の配列
  reserv.menu = vals.join(" ＋ "); // UI表示用の結合文字列
  
  addUser(labels.join(" ＋ "));
  wait(function(){
    addBot("「" + reserv.menu + "」ですね 🌸");
    if (patient.name) {
      reserv.sei=patient.sei||""; reserv.mei=patient.mei||"";
      reserv.seiKana=patient.seiKana||""; reserv.meiKana=patient.meiKana||"";
      reserv.tel=patient.tel||""; reserv.whoConfirmed=true;
    } else if (reserv.sei) { reserv.whoConfirmed=true; }
    wait(function() { askWho(); }, 600);
  }, 400);
}

// -------------------------------------------------------------
// 【改修2】 スマートな時間枠生成 (loadSlots)
// -------------------------------------------------------------
function loadSlots(date, zone) {
  showTyping();
  // 複数メニューの場合は代表として最初のメニューをGASに投げる
  var menuQuery = (reserv.menuList && reserv.menuList.length > 0) ? reserv.menuList[0] : reserv.menu;

  fetch(GAS_URL, { method:"POST", body:JSON.stringify({ token:AUTH_TOKEN, action:"getSuggestedSlots", date:date, menu:menuQuery }) })
  .then(function(r){return r.json();})
  .then(function(data) {
    removeTyping();
    if (!data.success || !data.slots || data.slots.length===0) {
      addBot("申し訳ありません。その日は空きがありませんでした 😢");
      wait(function(){ askDate(); }, 600); return;
    }
    var allSlots = data.slots; // ex: ["10:00", "10:10", "10:20"...]
    
    // 指定時間帯でフィルタ
    var filtered = allSlots.filter(function(s){
      var h = parseInt(s.split(":")[0]);
      if (zone === "morning") return h >= 8  && h < 12;
      if (zone === "noon")    return h >= 12 && h < 15;
      if (zone === "evening") return h >= 15;
      return true;
    });

    if (filtered.length === 0) {
      var zoneLabel = zone==="morning"?"午前中":zone==="noon"?"昼頃":"夕方以降";
      addBot(zoneLabel + "の空きがありませんでした 😢\n他の時間帯を確認しますか？");
      wait(function(){
        showChoices([
          { label:"他の時間帯を見る", val:"other_zone" },
          { label:"別の日にする",     val:"other_day"  },
        ], function(v){
          if (v==="other_zone") { wait(function(){ loadSlots(date, "any"); }, 400); }
          else { wait(function(){ askDate(); }, 400); }
        });
      }, 600);
      return;
    }

    addBot("空きがございます 🌸\nご希望の時間をお選びください。");
    wait(function(){
      // 【スマート間引きロジック】
      var displaySlots = [];
      for(var h=8; h<=21; h++) {
         var hStr = pad(h);
         
         // 前半 (00〜29分) の空きを探す
         var half1 = filtered.filter(function(s){ return s.startsWith(hStr+":") && parseInt(s.split(":")[1]) < 30; });
         if(half1.length > 0) {
             if(half1.indexOf(hStr+":00") >= 0) displaySlots.push({ time: hStr+":00", status: "◯" });
             else displaySlots.push({ time: half1[0], status: "△" }); // 00分が埋まっていれば一番早い枠を△で出す
         }
         
         // 後半 (30〜59分) の空きを探す
         var half2 = filtered.filter(function(s){ return s.startsWith(hStr+":") && parseInt(s.split(":")[1]) >= 30; });
         if(half2.length > 0) {
             if(half2.indexOf(hStr+":30") >= 0) displaySlots.push({ time: hStr+":30", status: "◯" });
             else displaySlots.push({ time: half2[0], status: "△" }); // 30分が埋まっていれば一番早い枠を△で出す
         }
      }

      var wrap=document.createElement("div"); wrap.className="slots";
      
      // 最初は最大12枠まで表示
      displaySlots.slice(0,12).forEach(function(s){
        var btn=document.createElement("button"); btn.className="slotbtn";
        btn.innerHTML = s.time + '<div class="'+(s.status==="◯"?'slot-status-o':'slot-status-t')+'">'+s.status+'</div>';
        btn.onclick=function(){
          wrap.querySelectorAll("button").forEach(function(b){ b.disabled=true; });
          onTimeSelect(s.time);
        };
        wrap.appendChild(btn);
      });

      // もっと見るボタン
      if (displaySlots.length > 12) {
        var moreBtn = document.createElement("button");
        moreBtn.className="slotbtn"; 
        moreBtn.innerHTML='<span style="font-size:12px;font-weight:normal;">もっと見る</span>';
        moreBtn.style.borderStyle="dashed";
        moreBtn.onclick=function(){
          moreBtn.remove();
          displaySlots.slice(12).forEach(function(s){
            var btn=document.createElement("button"); btn.className="slotbtn";
            btn.innerHTML = s.time + '<div class="'+(s.status==="◯"?'slot-status-o':'slot-status-t')+'">'+s.status+'</div>';
            btn.onclick=function(){
              wrap.querySelectorAll("button").forEach(function(b){ b.disabled=true; });
              onTimeSelect(s.time);
            };
            wrap.appendChild(btn);
          });
          scrollB();
        };
        wrap.appendChild(moreBtn);
      }
      document.getElementById("msgs").appendChild(wrap); scrollB();
    }, 600);
  })
  .catch(function(){ removeTyping(); addBot("空き時間の確認でエラーが発生しました 😢", "error"); });
}


// --- 既存のフローロジック (askPurpose, showConfirmCard など) ---
function askPurpose() {
  addBot("ご予約・ご相談はお気軽にどうぞ 🌸");
  wait(function() {
    var choices = [
      { label:"📅 予約する",                         val:"reserve" },
      { label:"📋 予約状況を確認したい",               val:"check" },
      { label:"💎 月1回施療会員になって10%OFFしたい", val:"subsinfo" },
      { label:"🚗 往診を希望したい",                   val:"visit" },
      { label:"💬 その他・相談したい",                 val:"other" },
    ];
    if (patient.name) choices.splice(2, 0, { label:"✏️ 登録情報を変更したい", val:"editprofile" });
    showChoices(choices, onPurpose);
  }, 600);
}

function askPurposeOnly() {
  addBot("今日はどうしますか？ 🌸");
  wait(function(){ askMultiMenu(); }, 600); // メニュー選択をマルチメニューに統一
}

function askMenuForNewUser() { askMultiMenu(); }

function onMenuSelect(val) {
  if (val === "consult") {
    wait(function() { askMultiMenu(); }, 400);
    return;
  }
  // ... 既存のシングルメニュー直接選択時のフォールバック ...
  reserv.menu = val;
  wait(function() {
    addBot("「" + val + "」ですね 🌸");
    if (patient.name) {
      reserv.sei=patient.sei||""; reserv.mei=patient.mei||"";
      reserv.seiKana=patient.seiKana||""; reserv.meiKana=patient.meiKana||"";
      reserv.tel=patient.tel||""; reserv.whoConfirmed=true;
    } else if (reserv.sei) reserv.whoConfirmed=true;
    wait(function() { askWho(); }, 600);
  }, 400);
}

// 予約確認カード（複数メニューの表示もそのままOK）
function showConfirmCard() {
  addBot("ご予約内容を確認してください 🌸");
  wait(function() {
    var name = (reserv.sei||"")+" "+(reserv.mei||"");
    var kana = (reserv.seiKana||"")+" "+(reserv.meiKana||"");
    var wrap = document.createElement("div"); wrap.className = "cardwrap";
    wrap.innerHTML = '<div class="card"><h3>📋 予約内容の確認</h3>'
      + row("お名前", name+"（"+kana+"）")
      + row("連絡先", reserv.tel||"")
      + row("メニュー", reserv.menu||"") // 複数結合済みの文字が表示される
      + row("日時", (reserv.date||"")+" "+(reserv.time||""))
      + '<div class="btnrow">'
      + '<button class="btnok" onclick="confirmReservation()">この内容で予約する</button>'
      + '<button class="btnng" onclick="correctReservation()">訂正する</button>'
      + '</div></div>';
    document.getElementById("msgs").appendChild(wrap); scrollB();
  }, 400);
}

function confirmReservation() {
  addBot("予約の手続きをしています 🌸");
  showTyping();
  var motivationText = { quick:"早く痛みを取りたい", fundamental:"根本から改善・再発させたくない", longterm:"定期的にずっと診てもらいたい", maintain:"体の維持・管理がしたい" };
  reserv.motivationText = motivationText[reserv.motivation] || "";

  // GASへは reserv オブジェクトをまるごと投げる。
  // その中に reserv.menuList（配列）が含まれているため、GAS側で適切に処理可能。
  fetch(GAS_URL, { method:"POST", body:JSON.stringify(Object.assign({ token:AUTH_TOKEN, action:"makeReservation" }, reserv)) })
  .then(function(r){return r.json();})
  .then(function(data) {
    removeTyping();
    if (data.success) {
      if (reserv.sei) {
        patient.sei=reserv.sei; patient.mei=reserv.mei;
        patient.seiKana=reserv.seiKana; patient.meiKana=reserv.meiKana;
        patient.name=reserv.sei+" "+reserv.mei; patient.tel=reserv.tel;
        saveData("sakura_patient", patient);
      }
      addBot("ご予約の手続きが完了しました 🌸\nご確認まで少々お待ちください。");
      reserv.upcomingCount = data.upcomingCount || 0;
      wait(function(){ askArrival(); }, 1000);
    } else {
      addBot("⚠️ 予約登録に問題が発生しました。\nお電話（078-984-5788）でご確認ください。","error"); showRestartButton();
    }
  });
}
