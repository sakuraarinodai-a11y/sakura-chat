<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サクラ整骨院 - AI予約チャット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#e8839a; --pink-light:#fde8ee; --pink-dark:#c45d75; --gray:#6b7280; --text:#1f2937; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans JP',sans-serif; background:linear-gradient(135deg,#fff5f7,#fde8ee,#fff0f3); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:480px; background:white; border-radius:24px; box-shadow:0 8px 40px rgba(232,131,154,0.2); overflow:hidden; display:flex; flex-direction:column; height:90vh; max-height:800px; }
  .header { background:linear-gradient(135deg,var(--pink),var(--pink-dark)); padding:18px 24px; color:white; display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .hicon { width:46px; height:46px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .htxt h1 { font-family:'Shippori Mincho',serif; font-size:16px; font-weight:600; }
  .htxt p { font-size:12px; opacity:0.85; margin-top:2px; }
  .hstatus { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; }
  .dot { width:8px; height:8px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .msgs { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .msgs::-webkit-scrollbar { width:4px; }
  .msgs::-webkit-scrollbar-thumb { background:#f9a8b8; border-radius:4px; }
  .bw { display:flex; gap:8px; animation:up 0.3s ease; }
  .bw.user { flex-direction:row-reverse; }
  @keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .av { width:32px; height:32px; background:var(--pink-light); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:4px; }
  .bub { max-width:80%; padding:11px 15px; border-radius:18px; font-size:14px; line-height:1.7; word-break:break-word; }
  .bub.bot { background:var(--pink-light); color:var(--text); border-top-left-radius:4px; }
  .bub.user { background:var(--pink); color:white; border-top-right-radius:4px; }
  .bub.error { background:#fee2e2; color:#dc2626; }
  .bub.warn { background:#fef3c7; color:#92400e; }
  .choices { display:flex; flex-direction:column; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .cbtn { padding:10px 16px; background:white; border:1.5px solid var(--pink); border-radius:20px; font-size:14px; color:var(--pink-dark); cursor:pointer; text-align:left; transition:all 0.2s; }
  .cbtn:hover { background:var(--pink-light); }
  .cbtn:disabled { opacity:0.4; cursor:not-allowed; }
  .cbtn.gold { border-color:#d97706; color:#92400e; background:#fffbeb; }
  .cbtn.gold:hover { background:#fef3c7; }
  .cbtn.red { border-color:#dc2626; color:#dc2626; background:#fff5f5; }
  .slots { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .slotbtn { padding:8px 14px; background:white; border:1.5px solid var(--pink); border-radius:20px; font-size:13px; color:var(--pink-dark); cursor:pointer; }
  .slotbtn:hover { background:var(--pink-light); }
  .cardwrap { padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .card { background:linear-gradient(135deg,#fff5f7,#fde8ee); border:2px solid var(--pink-light); border-radius:16px; padding:16px; font-size:13px; }
  .card.gold { background:linear-gradient(135deg,#fffbeb,#fef3c7); border-color:#fcd34d; }
  .card.warn { background:linear-gradient(135deg,#fff7ed,#fef3c7); border-color:#f59e0b; }
  .card h3 { color:var(--pink-dark); font-size:14px; margin-bottom:10px; font-weight:600; }
  .card.gold h3 { color:#92400e; }
  .card.warn h3 { color:#b45309; }
  .card .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #fce4ec; }
  .card .row:last-of-type { border-bottom:none; }
  .card .lbl { color:var(--gray); }
  .card p { font-size:13px; line-height:1.8; color:#374151; margin-bottom:10px; }
  .card .price { font-size:22px; font-weight:700; color:#92400e; text-align:center; padding:8px 0; }
  .card .price small { font-size:13px; font-weight:400; color:var(--gray); }
  .btnrow { display:flex; gap:8px; margin-top:12px; }
  .btnok { flex:1; padding:10px; background:var(--pink); color:white; border:none; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .btnok:hover { background:var(--pink-dark); }
  .btnok.gold { background:linear-gradient(135deg,#f59e0b,#d97706); }
  .btnok.gold:hover { background:#b45309; }
  .btnng { flex:1; padding:10px; background:white; color:var(--gray); border:1px solid #e5e7eb; border-radius:12px; font-size:14px; cursor:pointer; }
  .linebtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#06C755; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; }
  .ytbtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#FF0000; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; text-decoration:none; }
  .telbtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; background:#1d4ed8; color:white; border:none; border-radius:20px; font-size:15px; font-weight:700; cursor:pointer; width:100%; margin-top:8px; text-decoration:none; }
  .typing-bub { display:flex; gap:4px; align-items:center; padding:12px 16px; background:var(--pink-light); border-radius:18px; border-top-left-radius:4px; }
  .typing-bub span { width:7px; height:7px; background:var(--pink); border-radius:50%; animation:bounce 1.2s infinite; }
  .typing-bub span:nth-child(2){animation-delay:0.2s}
  .typing-bub span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .footer { padding:12px 16px; border-top:1px solid #fce4ec; background:white; flex-shrink:0; }
  .iw { display:flex; gap:8px; align-items:center; }
  .inp { flex:1; border:1.5px solid #fce4ec; border-radius:24px; padding:10px 16px; font-size:14px; font-family:inherit; outline:none; resize:none; max-height:80px; overflow-y:auto; line-height:1.5; }
  .inp:focus { border-color:var(--pink); }
  .inp:disabled { background:#fafafa; color:#aaa; }
  .sbtn { width:40px; height:40px; background:var(--pink); border:none; border-radius:50%; color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sbtn:disabled { background:#f3c4cf; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="hicon">🌸</div>
    <div class="htxt"><h1>サクラ整骨院</h1><p>AI予約アシスタント</p></div>
    <div class="hstatus"><div class="dot"></div>受付中</div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="footer">
    <div class="iw">
      <textarea class="inp" id="inp" placeholder="上の選択肢からお選びください" rows="1" disabled></textarea>
      <button class="sbtn" id="sbtn" onclick="sendText()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 定数
// ============================================================
var GAS_URL    = "https://script.google.com/macros/s/AKfycbyfHn9LJJMs7KQNi0rxTVUTwvOlma_VwM8sXdabL693gx9h1xguR-vibe3D8MbZseR6/exec";
var LINE_URL   = "https://line.me/R/ti/p/%40487yoson";
var YOUTUBE_KOBE  = "https://youtu.be/_wXc0tYJ5wk?si=XL0Kk8ZhG-uBq-Rx";
var YOUTUBE_SANDA = "https://youtu.be/u7JdsKxg6yM?si=TaoGEgALM42uw-Kt";
var SQUARE_URL = "https://square.link/u/eB3F1BoG";
var TEL        = "078-984-5788";
var AUTH_TOKEN = "sakura_2026_secret";

// 営業時間（0=日,1=月...6=土）
var BIZ_HOURS = {
  1:{s:"08:00",e:"21:00"}, 2:{s:"08:00",e:"21:00"},
  3:{s:"08:00",e:"15:00"}, 4:{s:"08:00",e:"21:00"},
  5:{s:"08:00",e:"21:00"}, 6:{s:"08:00",e:"15:00"}
};

// ============================================================
// 状態
// ============================================================
var patient = loadData("sakura_patient") || {};
var family  = loadData("sakura_family")  || [];
var reserv  = {};
var step    = "";
var surveyAnswers = {};
var accidentData  = {};

// ============================================================
// GAS通信ラッパー
// ============================================================
function gasPost(payload, onSuccess, onError) {
  payload.token = AUTH_TOKEN;
  showTyping();
  fetch(GAS_URL, { method:"POST", body:JSON.stringify(payload) })
  .then(function(r){ return r.json(); })
  .then(function(d){ removeTyping(); onSuccess(d); })
  .catch(function(e){
    removeTyping();
    if (onError) { onError(e); }
    else {
      addBot("通信エラーが発生しました。\nもう一度お試しください 🙏","error");
      wait(function(){ askPurpose(); }, 1200);
    }
  });
}

// ============================================================
// 営業時間チェック
// ============================================================
function isBusinessHours() {
  var now = new Date();
  var dow = now.getDay();
  var biz = BIZ_HOURS[dow];
  if (!biz) return false;
  var hhmm = pad(now.getHours()) + ":" + pad(now.getMinutes());
  return hhmm >= biz.s && hhmm < biz.e;
}

// ============================================================
// 起動
// ============================================================
window.onload = function() {
  wait(function() {
    if (patient.name) {
      addBot("おかえりなさい 🌸\n" + patient.name + "様ですね？");
      wait(function() {
        showChoices([
          { label:"はい、" + patient.name + "です", val:"yes" },
          { label:"いいえ、別の方です", val:"no" },
        ], onReturnUser);
      }, 600);
    } else {
      addBot("こんにちは！\nサクラ整骨院のAIアシスタントです 🌸");
      wait(function() {
        addBot("ご予約・お悩みのご相談をお気軽にどうぞ。");
        wait(function() {
          showChoices([
            { label:"初めてのご利用です", val:"new" },
            { label:"以前ご利用いただいたことがあります", val:"existing" },
          ], onFirstOrReturn);
        }, 800);
      }, 700);
    }
  }, 400);
};

// ============================================================
// 初回 or 既存判定
// ============================================================
function onFirstOrReturn(val) {
  if (val === "new") {
    wait(function(){ askPurpose(); }, 400);
  } else {
    wait(function(){
      addBot("お電話番号を入力してください。\n（ハイフンなし・例：0789845788）");
      step = "restore_tel"; enableInput();
    }, 400);
  }
}

// ============================================================
// 2回目以降：本人確認
// ============================================================
function onReturnUser(val) {
  if (val === "yes") {
    if (!patient.karteVerified) {
      // 初回のみお客様番号で確認
      wait(function(){
        addBot("初回のみ、診察券のお客様番号で本人確認をさせてください 🌸\nお客様番号を入力してください。");
        step = "karte_verify"; enableInput();
      }, 400);
    } else {
      // 確認済みはスキップ
      wait(function(){ askWhoForReturn(); }, 400);
    }
  } else {
    // 別の方→patientをクリアしてから電話番号で検索
    patient = { name:"", sei:"", mei:"", seiKana:"", meiKana:"", tel:"", karteId:"" };
    family = [];
    saveData("sakura_patient", patient);
    saveData("sakura_family", family);
    wait(function(){
      addBot("お電話番号を入力してください。\n（ハイフンなし・例：0789845788）");
      step = "restore_tel"; enableInput();
    }, 400);
  }
}

// 電話番号で復元→診察券No確認
function restoreByTel(tel) {
  gasPost(
    { action:"searchPatient", kana:"", tel:tel },
    function(d) {
      if (d.success && d.found) {
        addBot("情報が見つかりました 🌸\n本人確認のため、診察券のNoを入力してください。");
        window._restoreData = d;
        step = "restore_karteid"; enableInput();
      } else {
        // 見つからない→patientクリアして初回フローへ
        patient = { name:"", sei:"", mei:"", seiKana:"", meiKana:"", tel:"", karteId:"" };
        family = [];
        saveData("sakura_patient", patient);
        saveData("sakura_family", family);
        addBot("情報が見つかりませんでした。\n新規のお客様として進めます 🌸");
        wait(function(){ askPurpose(); }, 800);
      }
    },
    function(){
      addBot("確認中にエラーが発生しました。\n新規のお客様として進めます 🌸","error");
      wait(function(){ askPurpose(); }, 1000);
    }
  );
}

// お客様番号照合（初回のみ）
function verifyKarteIdFromCache(karteid) {
  // karteIdが保存済みの場合はローカルで照合
  if (patient.karteId && String(patient.karteId) === String(karteid)) {
    patient.karteVerified = true;
    saveData("sakura_patient", patient);
    addBot("確認できました 🌸\n" + patient.name + "様、おかえりなさい！");
    wait(function(){ askWhoForReturn(); }, 600);
    return;
  }

  // karteIdが未保存の場合はGASで検索して照合
  showTyping();
  gasPost(
    { action:"searchPatient", kana: patient.seiKana + " " + patient.meiKana, tel: patient.tel },
    function(d){
      removeTyping();
      if (d.success && d.found && String(d.customerNo) === String(karteid)) {
        patient.karteId = d.customerNo;
        patient.karteVerified = true;
        patient.crmId = d.crmId || patient.crmId || "";
        saveData("sakura_patient", patient);
        addBot("確認できました 🌸\n" + patient.name + "様、おかえりなさい！");
        wait(function(){ askWhoForReturn(); }, 600);
      } else {
        // 失敗→新規予約へ誘導
        patient = { name:"", sei:"", mei:"", seiKana:"", meiKana:"", tel:"", karteId:"" };
        family = [];
        saveData("sakura_patient", patient);
        saveData("sakura_family", family);
        addBot("お客様番号が一致しませんでした。\n\n新規のお客様としてご予約をお取りします 🌸\n\n※次回からお名前入力を省略するには、来院時に窓口でお客様番号をご確認いただき、このチャットで一度ログインしてください。");
        wait(function(){ askPurpose(); }, 1000);
      }
    },
    function(){
      removeTyping();
      addBot("確認中にエラーが発生しました。\nお電話（" + TEL + "）までお問い合わせください。", "error");
    }
  );
}

// 診察券No照合（電話番号からの復元フロー用）function verifyKarteId(karteid) {
  var d = window._restoreData;
  if (!d) { wait(function(){ askPurpose(); }, 400); return; }

  if (String(d.customerNo) === String(karteid).trim()) {
    patient.name     = d.name     || patient.name || "";
    patient.sei      = d.sei      || "";
    patient.mei      = d.mei      || "";
    patient.seiKana  = d.seiKana  || "";
    patient.meiKana  = d.meiKana  || "";
    patient.tel      = d.tel      || "";
    patient.karteId  = d.customerNo || "";
    patient.karteVerified = true;
    saveData("sakura_patient", patient);
    addBot("確認できました 🌸\n" + patient.name + "様、おかえりなさい！");
    wait(function(){ askWhoForReturn(); }, 800);
  } else {
    addBot("番号が一致しませんでした。\n新規のお客様として登録します。\n※後日スタッフが統合いたします 🌸");
    wait(function(){ askPurpose(); }, 800);
  }
}

// ============================================================
// 2回目以降：誰の予約か（家族含む）
// ============================================================
function askWhoForReturn() {
  var choices = [{ label: patient.name + "様ご自身", val:"self" }];
  family.forEach(function(f, i){
    choices.push({ label: f.name + "さん", val:"family_"+i });
  });
  choices.push({ label:"家族・友人（新規登録）", val:"new_family" });

  addBot("どなたのご予約ですか？");
  wait(function(){
    showChoices(choices, function(val){
      if (val === "self") {
        reserv.sei=patient.sei||""; reserv.mei=patient.mei||"";
        reserv.seiKana=patient.seiKana||""; reserv.meiKana=patient.meiKana||"";
        reserv.tel=patient.tel||"";
        reserv.whoConfirmed = true;  // 誰の予約か確定済み
        wait(function(){ checkPastReservations(); }, 400);
      } else if (val === "new_family") {
        wait(function(){
          addBot("ご家族・お友達のお名前を教えてください。\n（例：山田 花子）");
          step="family_name"; enableInput();
        }, 400);
      } else {
        var idx = parseInt(val.replace("family_",""));
        var f = family[idx];
        reserv.sei=f.sei||""; reserv.mei=f.mei||"";
        reserv.seiKana=f.seiKana||""; reserv.meiKana=f.meiKana||"";
        reserv.tel=f.tel||patient.tel||"";
        reserv.whoConfirmed = true;  // 誰の予約か確定済み
        addBot(f.name + "さんのご予約ですね 🌸");
        wait(function(){ checkPastReservations(); }, 600);
      }
    });
  }, 600);
}

// ============================================================
// 過去予約確認・3ヶ月分岐
// ============================================================
function checkPastReservations() {
  showTyping();
  gasPost(
    { action:"getPastReservations", name:reserv.sei+" "+reserv.mei, tel:reserv.tel },
    function(d) {
      removeTyping();
      if (!d.success || !d.found || !d.lastDate) {
        wait(function(){ askPrevFeedbackOrPurpose(); }, 400);
        return;
      }

      // 1ヶ月以内の来院回数を保存（料金計算に使用）
      reserv.visitCountThisMonth = d.visitCountThisMonth || 0;

      var daysSince = Math.floor((new Date() - new Date(d.lastDate)) / (1000*60*60*24));

      if (daysSince > 90) {
        // 3ヶ月以上→初回と同じ扱い
        reserv.visitCountThisMonth = 0; // リセット
        addBot("しばらくぶりですね 🌸\nまた来てくださってありがとうございます。");
        wait(function(){ askPrevFeedbackOrPurpose(); }, 600);

      } else if (daysSince > 30) {
        // 1ヶ月以上3ヶ月未満→初診（保険）or おすすめ初診を選べる
        addBot("前回から" + daysSince + "日ぶりですね 🌸\nメニューはどうしますか？");
        wait(function(){
          showChoices([
            { label:"おすすめ初診　（問診・検査あり）", val:"shinsatsu" },
            { label:"初診（保険）　検査なし・約20分",   val:"hoken" },
          ], function(v){
            if (v==="shinsatsu") {
              wait(function(){ showShinsatsuCard(); }, 400);
            } else {
              wait(function(){
                showHokenShinsatsuCard(function(insType){
                  reserv.menu="初診（保険）";
                  addBot("初診（保険）で予約します 🌸");
                  wait(function(){ askWho(); }, 600);
                });
              }, 400);
            }
          });
        }, 600);

      } else {
        // 1ヶ月以内
        var isAccidentMenu = d.lastMenu && d.lastMenu.indexOf("交通事故") !== -1;

        if (isAccidentMenu) {
          // 交通事故は同じ症状か聞かずに直接メニュー選択へ
          wait(function(){ askRepeatMenu(d.lastMenu); }, 400);
        } else {
          // 通常：前回と同じ症状か確認
          addBot("前回は「" + d.lastMenu + "」でご予約でした。\n前回と同じ症状ですか？");
          wait(function(){
            showChoices([
              { label:"はい、同じです",       val:"same_symptom" },
              { label:"いいえ、違う症状です", val:"diff_symptom" },
            ], function(v){
              if (v === "diff_symptom") {
                wait(function(){ askPurposeOnly(); }, 400);
              } else {
                wait(function(){ askRepeatMenu(d.lastMenu); }, 400);
              }
            });
          }, 600);
        }
      }
    },
    function(){
      removeTyping();
      wait(function(){ askPrevFeedbackOrPurpose(); }, 400);
    }
  );
}

function askPrevFeedbackOrPurpose() {
  if (checkShouldAskSurvey()) { askPrevFeedback(); }
  else { askPurpose(); }
}

// ============================================================
// リピーター：前回メニュー別フロー
// ============================================================
function askRepeatMenu(lastMenu) {

  // 交通事故治療・交通事故無料相談
  if (lastMenu.indexOf("交通事故") !== -1) {
    addBot("交通事故治療ですね 🌸\n今日はどちらにしますか？");
    wait(function(){
      showChoices([
        { label:"5分　（短時間通院）", val:"short" },
        { label:"30分",               val:"long"  },
      ], function(v){
        if (v === "short") {
          // 5分は「施術5分」メニュー、メモに交通事故を付記
          reserv.menu = "施術5分";
          reserv.accidentDuration = "5分";

  if (!patient.lastSurveyDate) return true;
  var diff = (new Date() - new Date(patient.lastSurveyDate)) / (1000*60*60*24);
  return diff >= 90;
}

function insuranceFeeLabel(insType, base) {
  // 来院回数（今回の来院を加えた回数）
  var visitCount = (reserv.visitCountThisMonth || 0) + 1;

  if (base === "shinsatsu") {
    // おすすめ初診（自費＋検査）は来院回数に関わらず固定
    if (insType==="ippan1"||insType==="ippan2"||insType==="ippan3"||insType==="ippan_unknown")
      return "3,000円（初診料1,500円＋検査1,500円）";
    if (insType==="med400") return "1,900円（医療証400円＋検査1,500円）";
    if (insType==="med800") return "2,300円（医療証800円＋検査1,500円）";
    if (insType==="medother") return "1,600円（窓口100円＋検査1,500円）";
    return "窓口でご確認ください";
  }

  if (base === "hoken") {
    // 保険5分：来院回数で料金が変わる
    var label = visitCount === 1 ? "初診" : visitCount === 2 ? "再診" : "3回目以降";

    if (insType==="ippan1") {
      var fee = visitCount === 1 ? "1,500円" : visitCount === 2 ? "800円" : "290円";
      return fee + "（" + label + "・1割）目安";
    }
    if (insType==="ippan2") {
      var fee = visitCount === 1 ? "1,500円" : visitCount === 2 ? "800円" : "370円";
      return fee + "（" + label + "・2割）目安";
    }
    if (insType==="ippan3") {
      var fee = visitCount === 1 ? "1,500円" : visitCount === 2 ? "800円" : "470円";
      return fee + "（" + label + "・3割）目安";
    }
    if (insType==="ippan_unknown") {
      return visitCount === 1 ? "1,500円（初診）目安" : visitCount === 2 ? "800円（再診）目安" : "290〜470円（3回目以降）目安";
    }
    if (insType==="med400") return "400円（医療証）目安";
    if (insType==="med800") return "800円（医療証）目安";
    if (insType==="medother") return "100円（医療証・窓口負担）目安";
    return "窓口でご確認ください";
  }

  return "窓口でご確認ください";
}

// ============================================================
// 空き時間
// ============================================================
function loadSlots(date, zone) {
  // 酸素カプセルは40分プランで取得
  var menuForSlot = reserv.menu === "酸素カプセル" ? "酸素カプセル40分" : reserv.menu;
  gasPost(
    { action:"getSuggestedSlots", date:date, menu:menuForSlot },
    function(data){
      if (!data.success || !data.slots || data.slots.length===0) {
        addBot("申し訳ありません。その日は空きがありませんでした 😢\n別の日でお探しします。");
        wait(function(){ askDate(); },800);
        return;
      }

      // 時間帯フィルター
      var allSlots = data.slots;
      var filtered = allSlots.filter(function(s){
        var h = parseInt(s.split(":")[0]);
        if (zone === "morning") return h >= 8  && h < 12;
        if (zone === "noon")    return h >= 12 && h < 15;
        if (zone === "evening") return h >= 15;
        return true; // any
      });

      // フィルター後に空なら他の時間帯を案内
      if (filtered.length === 0) {
        var zoneLabel = zone==="morning"?"午前中":zone==="noon"?"昼頃":"夕方以降";
        addBot(zoneLabel + "の空きがありませんでした 😢\n他の時間帯を確認しますか？");
        wait(function(){
          showChoices([
            { label:"他の時間帯を見る", val:"other_zone" },
            { label:"別の日にする",     val:"other_day"  },
          ], function(v){
            if (v==="other_zone") { wait(function(){ loadSlots(date, "any"); }, 400); }
            else { wait(function(){ askDate(); }, 400); }
          });
        }, 600);
        return;
      }

      addBot("空きがございます 🌸\nご希望の時間をお選びください。");
      wait(function(){
        var wrap=document.createElement("div"); wrap.className="slots";
        filtered.slice(0,12).forEach(function(s){
          var btn=document.createElement("button"); btn.className="slotbtn"; btn.textContent=s;
          btn.onclick=function(){
            wrap.querySelectorAll("button").forEach(function(b){ b.disabled=true; b.style.opacity="0.4"; });
            onTimeSelect(s);
          };
          wrap.appendChild(btn);
        });
        // 同じ時間帯にまだ枠がある場合「もっと見る」ボタン
        if (filtered.length > 12) {
          var moreBtn = document.createElement("button");
          moreBtn.className="slotbtn"; moreBtn.textContent="もっと見る…";
          moreBtn.style.borderStyle="dashed";
          moreBtn.onclick=function(){
            moreBtn.remove();
            filtered.slice(12).forEach(function(s){
              var btn=document.createElement("button"); btn.className="slotbtn"; btn.textContent=s;
              btn.onclick=function(){
                wrap.querySelectorAll("button").forEach(function(b){ b.disabled=true; b.style.opacity="0.4"; });
                onTimeSelect(s);
              };
              wrap.insertBefore(btn, moreBtn);
            });
            scrollB();
          };
          wrap.appendChild(moreBtn);
        }
        document.getElementById("msgs").appendChild(wrap); scrollB();
      },600);
    },
    function(){
      addBot("空き時間の確認でエラーが発生しました 😢\nお電話（"+TEL+"）でもご確認いただけます。","error");
      wait(function(){ askDate(); },1200);
    }
  );
}

function onCompanionCheckDone(mode) {
  // チェックされた人を収集
  var checkboxes = document.querySelectorAll('.cardwrap input[type="checkbox"]:checked');
  reserv.companions = [];

    wait(function(){ addCompanion(window._companionCallback); }, 400);

    var needMenu = reserv.companions.filter(function(c){ return !c.menu; });
    if (needMenu.length > 0) {
      wait(function(){ askCompanionMenu(0, window._companionCallback); }, 400);
    } else {

  addBot("同行者のお名前を教えてください。\n（例：山田 花子）");

  window._companionCallback = callback;

function onCompanionNameInput(name) {
  var parts = name.trim().split(/\s+/);
  var newComp = { name: name.trim(), sei: parts[0]||name.trim(), mei: parts[1]||"", seiKana:"", meiKana:"", tel:"" };

  // familyに同じ名前の登録があるか確認
  var existIdx = -1;
  family.forEach(function(f, i){
    if (f.name === newComp.name || f.sei === newComp.sei) existIdx = i;
  });

  if (existIdx >= 0) {
    var existing = family[existIdx];
    addBot(existing.name + "さんは登録済みです。\nこの方ですか？");
    wait(function(){
      showChoices([
        { label:"はい、この方です", val:"yes" },
        { label:"別の方です",       val:"no"  },
      ], function(v){
        if (v === "yes") {
          // 既存データを使いつつ上書き対象としてセット
          window._pendingCompanion = Object.assign({}, existing, { _familyIdx: existIdx });
          wait(function(){ askCompanionMenuForNew(window._companionCallback); }, 400);
        } else {
          // 別の方→そのまま新規として登録
          window._pendingCompanion = newComp;
          wait(function(){ askCompanionMenuForNew(window._companionCallback); }, 400);
        }
      });
    }, 600);
  } else {
    window._pendingCompanion = newComp;
    wait(function(){ askCompanionMenuForNew(window._companionCallback); }, 400);
  }
}

function askCompanionMenuForNew(callback) {
  var isAccident = reserv.accidentDuration || (reserv.menu === "交通事故治療") || (reserv.menu === "交通事故無料相談");
  if (isAccident) {
    // 交通事故は固定
    window._pendingCompanion.menu = reserv.menu;
    window._pendingCompanion.accidentDuration = reserv.accidentDuration;
    finishAddCompanion(callback);
    return;
  }
  addBot(window._pendingCompanion.name + "さんのメニューは？");
  wait(function(){
    showChoices([
      { label:"代表者と同じ（" + reserv.menu + "）", val:"same"    },
      { label:"初診（保険）",                         val:"初診（保険）" },
      { label:"施術15分",                             val:"施術15分" },
      { label:"施術30分",                             val:"施術30分" },
      { label:"施術60分",                             val:"施術60分" },
    ], function(v){
      window._pendingCompanion.menu = (v === "same") ? reserv.menu : v;
      finishAddCompanion(callback);
    });
  }, 600);
}

function finishAddCompanion(callback) {
  var comp = window._pendingCompanion;
  // familyに保存（既存なら上書き・新規なら追加）
  if (typeof comp._familyIdx === "number" && comp._familyIdx >= 0) {
    family[comp._familyIdx] = Object.assign(family[comp._familyIdx], comp);
  } else {
    var existIdx = family.findIndex(function(f){ return f.name === comp.name; });
    if (existIdx >= 0) { family[existIdx] = Object.assign(family[existIdx], comp); }
    else { family.push(comp); }
  }
  saveData("sakura_family", family);

  if (!reserv.companions) reserv.companions = [];
  reserv.companions.push(Object.assign({}, comp));

  addBot(comp.name + "さんを追加しました 🌸");
  wait(function(){
    showChoices([
      { label:"他にも追加する", val:"more" },
      { label:"これで確定する", val:"done" },
    ], function(v){
      if (v === "more") {
        wait(function(){ addCompanion(callback); }, 400);
      } else {
        wait(function(){ callback(); }, 400);
      }
    });
  }, 600);
}

function confirmReservation() {
  var btn=document.getElementById("confirmBtn");
  if (btn) { btn.disabled=true; btn.style.opacity="0.4"; }
  addBot("予約の手続きをしています 🌸");

  var motivationText={ quick:"早く痛みを取りたい", fundamental:"根本から改善・再発させたくない",
    longterm:"定期的にずっと診てもらいたい", maintain:"体の維持・管理がしたい" };
  reserv.motivationText = motivationText[reserv.motivation]||"";

  // 酸素カプセルは40分プランIDで送信
  var sendReserv = Object.assign({}, reserv);
  if (sendReserv.menu === "酸素カプセル") sendReserv.menu = "酸素カプセル40分";

  // 交通事故治療は施術時間をメモに付加
  if (sendReserv.menu === "交通事故治療" && sendReserv.accidentDuration) {
    sendReserv.symptom = (sendReserv.symptom || "") + "【施術時間】" + sendReserv.accidentDuration;
  }

  gasPost(
    Object.assign({ action:"makeReservation" }, sendReserv),
    function(data){
      if (data.success) {
        // 初回なら保存確認
        if (!patient.name && reserv.sei) {
          askSaveConsent(
            function(){
              patient.sei=reserv.sei; patient.mei=reserv.mei;
              patient.seiKana=reserv.seiKana; patient.meiKana=reserv.meiKana;
              patient.name=reserv.sei+" "+reserv.mei; patient.tel=reserv.tel;
              saveData("sakura_patient", patient);
              addBot("保存しました 🌸");
              wait(function(){ registerCompanions(0, onReservationSuccess); },600);
            },
            function(){
              wait(function(){ registerCompanions(0, onReservationSuccess); },400);
            }
          );
        } else {
          registerCompanions(0, onReservationSuccess);
        }
      } else {
        addBot("⚠️ 予約登録に問題が発生しました。\nお電話（"+TEL+"）でご確認ください。","error");
        if (btn) { btn.disabled=false; btn.style.opacity="1"; }
      }
    },
    function(){
      addBot("通信エラーで予約が完了しませんでした 😢\nお電話（"+TEL+"）でご予約ください。","error");
      if (btn) { btn.disabled=false; btn.style.opacity="1"; }
    }
  );
}

// 同行者を順番にGAS登録
function registerCompanions(idx, callback) {
  var companions = reserv.companions || [];
  if (idx >= companions.length) {
    callback();
    return;
  }
  var comp = companions[idx];
  var compMenu = comp.menu || reserv.menu;
  if (compMenu === "酸素カプセル") compMenu = "酸素カプセル40分";

  var compData = {
    action:      "makeReservation",
    sei:         comp.sei || comp.name,
    mei:         comp.mei || "",
    seiKana:     comp.seiKana || "",
    meiKana:     comp.meiKana || "",
    tel:         comp.tel || reserv.tel,
    crmId:       comp.crmId || "",
    customerNo:  comp.customerNo || "",
    menu:        compMenu,
    date:        reserv.date,
    time:        reserv.time,
    symptom:     comp.accidentDuration ? "【交通事故治療】【施術時間】" + comp.accidentDuration : "",
    motivationText: reserv.motivationText || "",
  };

  gasPost(compData,
    function(){ registerCompanions(idx+1, callback); },
    function(){ registerCompanions(idx+1, callback); }
  );
}

function onReservationSuccess() {
  addBot("ご予約の手続きが完了しました 🌸\nご確認まで少々お待ちください。");
  wait(function(){ askArrival(); },1000);
}

// ============================================================
// 来院方法
// ============================================================
function askArrival() {
  // 来院経験者（キャッシュあり）または場所を知っている場合はスキップ
  if (patient.knowsLocation || patient.karteVerified || patient.karteId) {
    wait(function(){ showFinalConfirm(); }, 400);
    return;
  }
  addBot("ご来院の方法を教えてください。");
  wait(function(){
    showChoices([
      { label:"車で来る",          val:"car" },
      { label:"徒歩・電車で来る",  val:"walk" },
    ], function(mode){
      reserv.arrivalMode = mode;
      wait(function(){
        addBot("どちら方面からお越しですか？");
        wait(function(){
          showChoices([
            { label:"神戸方面から",     val:"kobe" },
            { label:"三田市方面から",   val:"sanda" },
            { label:"場所はわかります", val:"know" },
          ], function(dir){ onDirection(dir, mode); });
        }, 600);
      }, 400);
    });
  }, 600);
}

function onDirection(val, mode) {
  if (val === "know") {
    // 場所わかる→次回以降スキップ
    patient.knowsLocation = true;
    saveData("sakura_patient", patient);
    addBot("ありがとうございます 🌸\n次回からはこの質問を省略します。");
    wait(function(){ showFinalConfirm(); }, 600);
    return;
  }

  var label = val==="kobe" ? "神戸方面" : "三田市方面";
  wait(function(){
    if (mode === "walk") {
      // 徒歩・電車はYouTubeなし
      addBot(label + "からのルートは、\n有野台バス停からすぐです 🌸\nご不明な点はお電話（" + TEL + "）までどうぞ。");
      wait(function(){ showFinalConfirm(); }, 800);
    } else {
      // 車はYouTube案内
      var url = val==="kobe" ? YOUTUBE_KOBE : YOUTUBE_SANDA;
      addBot(label + "からのルートをご案内します 🌸");
      var wrap = document.createElement("div"); wrap.className="cardwrap";
      var btn = document.createElement("a"); btn.className="ytbtn"; btn.href=url; btn.target="_blank";
      btn.innerHTML="▶ YouTubeでルートを確認する";
      wrap.appendChild(btn);
      document.getElementById("msgs").appendChild(wrap); scrollB();
      wait(function(){ showFinalConfirm(); }, 1000);
    }
  }, 400);
}

// ============================================================
// 予約確定カード
// ============================================================
function showFinalConfirm() {
  addBot("ご予約が確定しました ✅");
  wait(function(){
    var wrap=document.createElement("div"); wrap.className="cardwrap";
    var menuLabel2 = reserv.menu || "";
    if (reserv.accidentDuration) {
      menuLabel2 = reserv.menu === "施術5分"
        ? "施術5分（交通事故・短時間通院）"
        : "交通事故治療（" + reserv.accidentDuration + "）";
    }
    wrap.innerHTML='<div class="card"><h3>✅ 予約確定</h3>'
      +row("お名前",(reserv.sei||"")+" "+(reserv.mei||""))
      +row("メニュー",menuLabel2)
      +row("日時",(reserv.date||"")+" "+(reserv.time||""))
      +row("ご連絡先",reserv.tel||"")
      +'</div>';
    document.getElementById("msgs").appendChild(wrap); scrollB();
    if (reserv.motivation==="fundamental"||reserv.motivation==="longterm"||reserv.motivation==="maintain") {
      wait(function(){
        addBot("サブスク会員（月7,800円）で\n施術60分＋追加10%OFFがとてもお得です 🌸");
        wait(function(){
          var w2=document.createElement("div"); w2.className="cardwrap";
          w2.innerHTML='<div class="btnrow" style="padding:0 16px 4px 56px;">'
            +'<a href="'+SQUARE_URL+'" target="_blank" class="btnok gold" style="text-decoration:none;">サブスクに申し込む ✨</a>'
            +'</div>';
          document.getElementById("msgs").appendChild(w2); scrollB();
          wait(function(){
            addBot("当日はお気をつけてお越しください 🌸\nご不明な点はお電話（"+TEL+"）までどうぞ。");
          },400);
        },600);
      },800);
    } else {
      wait(function(){
        addBot("当日はお気をつけてお越しください 🌸\nご不明な点はお電話（"+TEL+"）までどうぞ。");
      },600);
    }
  },400);
}

// ============================================================
// 往診
// ============================================================
function onVisitAddress(address) {
  reserv.visitAddress=address;
  addBot("距離を確認しています...");
  gasPost(
    { action:"calcDistance", address:address },
    function(data){
      if (data.success) {
        var fee=data.fee;
        if (fee>0) addBot("当院から約"+data.distanceKm+"kmですね。\n往復交通費として "+fee.toLocaleString()+"円が別途発生します。");
        else addBot("当院から約"+data.distanceKm+"kmですね。\n交通費は無料です 🌸");
        reserv.visitFee=fee; reserv.menu="往診";
        wait(function(){
          showChoices([
            { label:"この条件で予約する", val:"ok" },
            { label:"キャンセルする",     val:"cancel" },
          ], function(v){
            if (v==="ok") { wait(function(){ askWho(); },400); }
            else { wait(function(){ addBot("またのご利用をお待ちしております 🌸"); wait(function(){ askPurpose(); },600); },400); }
          });
        },600);
      } else {
        addBot("住所の確認ができませんでした 😢\nお電話（"+TEL+"）でご相談ください。","error");
        wait(function(){ askPurpose(); },1200);
      }
    },
    function(){
      addBot("距離の確認でエラーが発生しました 😢\nお電話（"+TEL+"）でご相談ください。","error");
      wait(function(){ askPurpose(); },1200);
    }
  );
}

// ============================================================
// 自由入力のAI判定
// ============================================================
function handleFreeInput(text) {
  gasPost(
    { action:"judgeIntent", text:text, reserv:reserv },
    function(data){
      addBot(data.reply);
      if (data.intent==="restart") {
        reserv={}; step=""; wait(function(){ askPurpose(); },800);

      } else if (data.intent==="correct") {
        wait(function(){ correctReservation(); },800);

      } else if (data.intent==="symptom") {
        // 入力テキスト全文を症状メモとして保存
        reserv.symptom = (reserv.symptom ? reserv.symptom + "\n" : "") + text;
        reserv.location = data.location || text;
        wait(function(){ askMotivation(); },800);

      } else if (data.intent==="menu") {
        wait(function(){ onMenuSelect(data.menu||"consult"); },800);

      } else if (data.intent==="reserve") {
        reserv={}; step=""; wait(function(){ askPurpose(); },800);

      } else if (data.intent==="access") {
        // 来院方法・アクセス案内
        wait(function(){
          showChoices([
            { label:"🚗 車で来る",         val:"car"  },
            { label:"🚶 徒歩・電車で来る", val:"walk" },
          ], function(mode){
            wait(function(){
              showChoices([
                { label:"神戸方面から",   val:"kobe"  },
                { label:"三田市方面から", val:"sanda" },
              ], function(dir){
                onDirection(dir, mode);
              });
            }, 600);
          });
        }, 600);

      } else if (data.intent==="hours") {
        // 営業時間（AIのreplyで答えているのでそのまま）
        wait(function(){
          showChoices([
            { label:"予約に進む",       val:"reserve" },
            { label:"最初に戻る",       val:"restart" },
          ], function(v){
            reserv={}; step=""; wait(function(){ askPurpose(); },400);
          });
        }, 800);

      } else if (data.intent==="price") {
        // 料金（AIのreplyで答えているのでそのまま）
        wait(function(){
          showChoices([
            { label:"予約に進む", val:"reserve" },
            { label:"最初に戻る", val:"restart" },
          ], function(v){
            reserv={}; step=""; wait(function(){ askPurpose(); },400);
          });
        }, 800);

      } else if (data.intent==="cancel") {
        // キャンセル・変更→電話案内（キャンセル機能実装後に拡張）
        wait(function(){
          var wrap=document.createElement("div"); wrap.className="cardwrap";
          wrap.innerHTML='<div class="card">'
            +'<h3>📞 キャンセル・変更のご連絡</h3>'
            +'<p>お電話にてご連絡ください 🌸<br>予約時間の2時間前までお受けします。</p>'
            +'<div class="btnrow">'
            +'<a href="tel:'+TEL+'" class="btnok telbtn" style="text-decoration:none;">📞 '+TEL+'</a>'
            +'</div></div>';
          document.getElementById("msgs").appendChild(wrap); scrollB();
        }, 600);

      } else if (data.intent==="check") {
        // 予約確認→電話案内（予約確認機能実装後に拡張）
        wait(function(){
          addBot("ご予約の確認はお電話（"+TEL+"）にてご案内しております 🌸\n近日中にチャットでも確認できるようにいたします。");
        }, 600);

      } else {
        // unknown・雑談→選択肢を出す
        wait(function(){
          showChoices([
            { label:"予約する",     val:"reserve" },
            { label:"最初に戻る",   val:"restart" },
          ], function(v){
            reserv={}; step=""; wait(function(){ askPurpose(); },400);
          });
        }, 800);
      }
    },
    function(){
      addBot("うまく聞き取れませんでした 🙏\nもう一度お選びください。","error");
      wait(function(){ askPurpose(); },1000);
    }
  );
}

// ============================================================
// テキスト送信
// ============================================================
function sendText() {
  var inp=document.getElementById("inp");
  var text=inp.value.trim();
  if (!text) return;
  addUser(text); inp.value=""; inp.style.height="auto"; disableInput();

  if (step==="restore_tel") {
    step=""; restoreByTel(text.replace(/-/g,""));
  } else if (step==="karte_verify") {
    step=""; verifyKarteIdFromCache(text.trim());
  } else if (step==="restore_karteid") {
    step=""; verifyKarteId(text);
  } else if (step==="accident_tel") {
    step=""; onAccidentTel(text.replace(/-/g,""));
  } else if (step==="name") {
    step=""; var p=text.trim().split(/[\s　]+/); reserv.sei=p[0]||text; reserv.mei=p[1]||"";
    wait(function(){ addBot("フリガナを教えていただけますか？\n（例：ヤマダ タロウ）"); step="kana"; enableInput(); },400);
  } else if (step==="kana") {
    step=""; var kp=text.trim().split(/[\s　]+/); reserv.seiKana=kp[0]||text; reserv.meiKana=kp[1]||"";
    // 保険区分未確認の場合はここで確認
    if (!reserv.insType) {
      wait(function(){ askInsuranceTypeForStamp(); }, 400);
    } else {
      if (reserv.tel) { wait(function(){ showConfirmCard(); },400); }
      else { wait(function(){ showChoices([{label:"📱 電話番号を入力する",val:"tel"},{label:"💚 LINEでお友達登録する",val:"line"}],onContactSelect); },400); }
    }
  } else if (step==="tel") {
    step=""; reserv.tel=text.replace(/-/g,""); wait(function(){ askDate(); },400);
  } else if (step==="date") {
    step="";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) {
      addBot("日付の形式が正しくありません。\n（例：2026-03-15）の形式で入力してください。","error");
      step="date"; enableInput(); return;
    }
    reserv.date=text; wait(function(){ askTimeZone(text); },400);
  } else if (step==="companion_name") {
    step=""; onCompanionNameInput(text);
  } else if (step==="family_name") {
    step=""; var fp=text.trim().split(/[\s　]+/);
    window._tmpFamily={name:text.trim(),sei:fp[0]||text,mei:fp[1]||"",seiKana:"",meiKana:"",tel:""};
    wait(function(){ addBot("フリガナを教えていただけますか？"); step="family_kana"; enableInput(); },400);
  } else if (step==="family_kana") {
    step=""; var fkp=text.trim().split(/[\s　]+/);
    window._tmpFamily.seiKana=fkp[0]||text; window._tmpFamily.meiKana=fkp[1]||"";
    wait(function(){
      addBot("電話番号はありますか？");
      showChoices([{label:"入力する",val:"yes"},{label:"スキップ",val:"skip"}], function(v){
        if (v==="yes") { step="family_tel"; enableInput(); }
        else {
          if (family.length<10){ family.push(window._tmpFamily); saveData("sakura_family",family); }
          reserv.sei=window._tmpFamily.sei; reserv.mei=window._tmpFamily.mei;
          reserv.seiKana=window._tmpFamily.seiKana; reserv.meiKana=window._tmpFamily.meiKana;
          reserv.tel=patient.tel||"";
          wait(function(){ askDate(); },400);
        }
      });
    },400);
  } else if (step==="family_tel") {
    step=""; window._tmpFamily.tel=text.replace(/-/g,"");
    if (family.length<10){ family.push(window._tmpFamily); saveData("sakura_family",family); }
    reserv.sei=window._tmpFamily.sei; reserv.mei=window._tmpFamily.mei;
    reserv.seiKana=window._tmpFamily.seiKana; reserv.meiKana=window._tmpFamily.meiKana;
    reserv.tel=text.replace(/-/g,"");
    wait(function(){ askDate(); },400);
  } else if (step==="visit_address") {
    step=""; wait(function(){ onVisitAddress(text); },400);
  } else if (step==="complaint") {
    step="";
    gasPost({ action:"notifyStaff", type:"complaint", message:text, patient:patient.name },
      function(){}, function(){});
    wait(function(){ addBot("ありがとうございます。必ずスタッフに伝えます 🌸"); wait(function(){ askPurpose(); },600); },400);
  } else if (step==="survey_symptom") {
    step=""; surveyAnswers.symptom=text; wait(function(){ surveyPain1(); },400);
  } else if (step==="location_free") {
    step=""; reserv.location=text; wait(function(){ askMotivation(); },400);
  } else {
    handleFreeInput(text);
  }
}

// ============================================================
// ユーティリティ
// ============================================================
function showChoices(choices, cb) {
  var wrap=document.createElement("div"); wrap.className="choices";
  choices.forEach(function(c){
    var btn=document.createElement("button");
    btn.className="cbtn"+(c.gold?" gold":"")+(c.red?" red":"");
    btn.textContent=c.label;
    btn.onclick=function(){
      wrap.querySelectorAll("button").forEach(function(b){ b.disabled=true; b.style.opacity="0.4"; });
      addUser(c.label);
      setTimeout(function(){ cb(c.val,c.label); },400);
    };
    wrap.appendChild(btn);
  });
  document.getElementById("msgs").appendChild(wrap); scrollB();
}

function addBot(text,type) {
  var w=document.createElement("div"); w.className="bw";
  w.innerHTML='<div class="av">🌸</div><div class="bub bot '+(type||"")+'">'+esc(text)+'</div>';
  document.getElementById("msgs").appendChild(w); scrollB();
}
function addUser(text) {
  var w=document.createElement("div"); w.className="bw user";
  w.innerHTML='<div class="bub user">'+esc(text)+'</div>';
  document.getElementById("msgs").appendChild(w); scrollB();
}
function showTyping() {
  if (document.getElementById("typing")) return;
  var el=document.createElement("div"); el.className="bw"; el.id="typing";
  el.innerHTML='<div class="av">🌸</div><div class="typing-bub"><span></span><span></span><span></span></div>';
  document.getElementById("msgs").appendChild(el); scrollB();
}
function removeTyping() { var el=document.getElementById("typing"); if(el) el.remove(); }
function enableInput() {
  var i=document.getElementById("inp"),b=document.getElementById("sbtn");
  i.disabled=false; b.disabled=false; i.placeholder="メッセージを入力..."; i.focus();
}
function disableInput() {
  var i=document.getElementById("inp"),b=document.getElementById("sbtn");
  i.disabled=true; b.disabled=true; i.placeholder="上の選択肢からお選びください";
}
function scrollB(){ var m=document.getElementById("msgs"); m.scrollTop=m.scrollHeight; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function wait(fn,ms){ setTimeout(fn,ms||400); }
function pad(n){ return ("0"+n).slice(-2); }
function row(l,v){ return '<div class="row"><span class="lbl">'+l+'</span><span>'+esc(v)+'</span></div>'; }
function saveData(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function loadData(k){ try{var d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch(e){return null;} }

document.getElementById("inp").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}
});
document.getElementById("inp").addEventListener("input",function(){
  this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,80)+"px";
});
</script>
