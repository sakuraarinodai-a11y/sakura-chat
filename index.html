<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サクラ整骨院 - AI予約チャット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#e8839a; --pink-light:#fde8ee; --pink-dark:#c45d75; --gray:#6b7280; --text:#1f2937; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans JP',sans-serif; background:linear-gradient(135deg,#fff5f7,#fde8ee,#fff0f3); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:480px; background:white; border-radius:24px; box-shadow:0 8px 40px rgba(232,131,154,0.2); overflow:hidden; display:flex; flex-direction:column; height:90vh; max-height:800px; }
  .header { background:linear-gradient(135deg,var(--pink),var(--pink-dark)); padding:18px 24px; color:white; display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .hicon { width:46px; height:46px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .htxt h1 { font-family:'Shippori Mincho',serif; font-size:16px; font-weight:600; }
  .htxt p { font-size:12px; opacity:0.85; margin-top:2px; }
  .hstatus { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; }
  .dot { width:8px; height:8px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .msgs { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .msgs::-webkit-scrollbar { width:4px; }
  .msgs::-webkit-scrollbar-thumb { background:#f9a8b8; border-radius:4px; }
  .bw { display:flex; gap:8px; animation:up 0.3s ease; }
  .bw.user { flex-direction:row-reverse; }
  @keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .av { width:32px; height:32px; background:var(--pink-light); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:4px; }
  .bub { max-width:80%; padding:11px 15px; border-radius:18px; font-size:14px; line-height:1.7; word-break:break-word; }
  .bub.bot { background:var(--pink-light); color:var(--text); border-top-left-radius:4px; }
  .bub.user { background:var(--pink); color:white; border-top-right-radius:4px; }
  .bub.error { background:#fee2e2; color:#dc2626; }
  .choices { display:flex; flex-direction:column; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .cbtn { padding:10px 16px; background:white; border:1.5px solid var(--pink); border-radius:20px; font-size:14px; color:var(--pink-dark); cursor:pointer; text-align:left; transition:all 0.2s; }
  .cbtn:hover { background:var(--pink-light); }
  .cbtn:disabled { opacity:0.4; cursor:not-allowed; }
  .slots { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .slotbtn { padding:8px 14px; background:white; border:1.5px solid var(--pink); border-radius:20px; font-size:13px; color:var(--pink-dark); cursor:pointer; }
  .slotbtn:hover { background:var(--pink-light); }
  .cardwrap { padding:0 16px 4px 56px; animation:up 0.3s ease; }
  .card { background:linear-gradient(135deg,#fff5f7,#fde8ee); border:2px solid var(--pink-light); border-radius:16px; padding:16px; font-size:13px; }
  .card h3 { color:var(--pink-dark); font-size:14px; margin-bottom:10px; font-weight:600; }
  .card .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #fce4ec; }
  .card .row:last-of-type { border-bottom:none; }
  .card .lbl { color:var(--gray); }
  .btnrow { display:flex; gap:8px; margin-top:12px; }
  .btnok { flex:1; padding:10px; background:var(--pink); color:white; border:none; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; }
  .btnok:hover { background:var(--pink-dark); }
  .btnng { flex:1; padding:10px; background:white; color:var(--gray); border:1px solid #e5e7eb; border-radius:12px; font-size:14px; cursor:pointer; }
  .linebtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#06C755; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; }
  .ytbtn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; background:#FF0000; color:white; border:none; border-radius:20px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; text-decoration:none; }
  .typing-bub { display:flex; gap:4px; align-items:center; padding:12px 16px; background:var(--pink-light); border-radius:18px; border-top-left-radius:4px; }
  .typing-bub span { width:7px; height:7px; background:var(--pink); border-radius:50%; animation:bounce 1.2s infinite; }
  .typing-bub span:nth-child(2){animation-delay:0.2s}
  .typing-bub span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .footer { padding:12px 16px; border-top:1px solid #fce4ec; background:white; flex-shrink:0; }
  .iw { display:flex; gap:8px; align-items:center; }
  .inp { flex:1; border:1.5px solid #fce4ec; border-radius:24px; padding:10px 16px; font-size:14px; font-family:inherit; outline:none; resize:none; max-height:80px; overflow-y:auto; line-height:1.5; }
  .inp:focus { border-color:var(--pink); }
  .inp:disabled { background:#fafafa; color:#aaa; }
  .sbtn { width:40px; height:40px; background:var(--pink); border:none; border-radius:50%; color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sbtn:disabled { background:#f3c4cf; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="hicon">🌸</div>
    <div class="htxt"><h1>サクラ整骨院</h1><p>AI予約アシスタント</p></div>
    <div class="hstatus"><div class="dot"></div>受付中</div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="footer">
    <div class="iw">
      <textarea class="inp" id="inp" placeholder="上の選択肢からお選びください" rows="1" disabled></textarea>
      <button class="sbtn" id="sbtn" onclick="sendText()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbyfHn9LJJMs7KQNi0rxTVUTwvOlma_VwM8sXdabL693gx9h1xguR-vibe3D8MbZseR6/exec";
var LINE_URL = "https://line.me/R/ti/p/%40487yoson";
var YOUTUBE_KOBE = "https://youtu.be/_wXc0tYJ5wk?si=XL0Kk8ZhG-uBq-Rx";
var YOUTUBE_SANDA = "https://youtu.be/u7JdsKxg6yM?si=TaoGEgALM42uw-Kt";
var CLINIC_ADDRESS = "兵庫県神戸市北区有野台2-1-7-9";

var patient = loadData("sakura_patient") || {};
var family = loadData("sakura_family") || [];
var reserv = {};
var step = "";
var lastSurveyDate = patient.lastSurveyDate || null;

// ============================================================
// 起動
// ============================================================
window.onload = function() {
  wait(function() {
    if (patient.name) {
      addBot("おかえりなさい、" + patient.name + "さん 🌸");
      // 前回の感想を聞くべきか確認
      var shouldAskSurvey = checkShouldAskSurvey();
      wait(function() {
        if (shouldAskSurvey) {
          addBot("前回の施術はいかがでしたか？");
          wait(function() {
            showChoices([
              { label:"とても良かった", val:"great" },
              { label:"良かった", val:"good" },
              { label:"普通", val:"normal" },
              { label:"改善してほしい点があった", val:"bad" },
            ], onSurveyFirst);
          }, 600);
        } else {
          askPurpose();
        }
      }, 600);
    } else {
      addBot("こんにちは！サクラ整骨院のAIアシスタントです 🌸");
      wait(function() {
        addBot("今日はどのようなお悩みでいらっしゃいますか？");
        wait(function() { askPurpose(); }, 600);
      }, 600);
    }
  }, 400);
};

// ============================================================
// 前回感想を聞くべきか
// ============================================================
function checkShouldAskSurvey() {
  if (!lastSurveyDate) return true;
  var last = new Date(lastSurveyDate);
  var now = new Date();
  var diff = (now - last) / (1000 * 60 * 60 * 24);
  return diff >= 90;
}

// ============================================================
// 前回感想
// ============================================================
function onSurveyFirst(val) {
  if (val === "great" || val === "good") {
    wait(function() {
      addBot("それは嬉しいです 🌸");
      wait(function() {
        addBot("Googleの口コミへのご投稿にご協力いただけますか？");
        wait(function() {
          showChoices([
            { label:"はい、協力します", val:"review_yes" },
            { label:"またの機会に", val:"review_no" },
          ], onReviewAsk);
        }, 600);
      }, 600);
    }, 400);
  } else if (val === "bad") {
    wait(function() {
      addBot("貴重なご意見ありがとうございます 🌸");
      wait(function() {
        addBot("どのような点でしょうか？お聞かせください。");
        step = "complaint";
        enableInput();
      }, 600);
    }, 400);
  } else {
    wait(function() {
      addBot("ありがとうございます 🌸");
      wait(function() { askPurpose(); }, 600);
    }, 400);
  }
}

function onReviewAsk(val) {
  if (val === "review_yes") {
    wait(function() {
      addBot("ありがとうございます 🌸");
      wait(function() {
        addBot("ご回答内容をもとに口コミ文をご用意しております。\n時短でそのままご利用いただいても結構です。");
        wait(function() { startSurvey(); }, 800);
      }, 600);
    }, 400);
  } else {
    patient.lastSurveyDate = new Date().toISOString();
    saveData("sakura_patient", patient);
    wait(function() {
      addBot("またの機会にぜひお願いします 🌸");
      wait(function() { askPurpose(); }, 600);
    }, 400);
  }
}

// ============================================================
// アンケート（会話形式）
// ============================================================
var surveyAnswers = {};
function startSurvey() {
  addBot("どのような症状でお悩みでしたか？");
  wait(function() {
    showChoices([
      { label:"首・肩の痛み", val:"首・肩の痛み" },
      { label:"腰の痛み", val:"腰の痛み" },
      { label:"膝・足の痛み", val:"膝・足の痛み" },
      { label:"背中の痛み", val:"背中の痛み" },
      { label:"その他", val:"other_symptom" },
    ], function(val) {
      if (val === "other_symptom") {
        addBot("どのような症状でしたか？");
        step = "survey_symptom"; enableInput(); return;
      }
      surveyAnswers.symptom = val;
      wait(function() { surveyQ2(); }, 400);
    });
  }, 600);
}

function surveyQ2() {
  addBot("施術前の痛みを10段階で教えてください。");
  wait(function() {
    var items = [];
    for (var i=10;i>=1;i--) items.push({label:i+"（"+painLabel(i)+"）",val:String(i)});
    showChoices(items, function(val) {
      surveyAnswers.painBefore = val;
      wait(function() { surveyQ3(); }, 400);
    });
  }, 600);
}

function surveyQ3() {
  addBot("施術後の痛みを10段階で教えてください。");
  wait(function() {
    var items = [];
    for (var i=1;i<=10;i++) items.push({label:i+"（"+painLabel(i)+"）",val:String(i)});
    showChoices(items, function(val) {
      surveyAnswers.painAfter = val;
      wait(function() { surveyQ4(); }, 400);
    });
  }, 600);
}

function surveyQ4() {
  addBot("施術の印象はいかがでしたか？");
  wait(function() {
    showChoices([
      { label:"丁寧な説明で安心できた", val:"丁寧な説明で安心できた" },
      { label:"痛みへの配慮が嬉しかった", val:"痛みへの配慮が嬉しかった" },
      { label:"想像以上に効果を感じた", val:"想像以上に効果を感じた" },
      { label:"他院と違うと感じた", val:"他院と違うと感じた" },
    ], function(val) {
      surveyAnswers.impression = val;
      wait(function() { surveyQ5(); }, 400);
    });
  }, 600);
}

function surveyQ5() {
  addBot("総合評価を教えてください。");
  wait(function() {
    showChoices([
      { label:"⭐⭐⭐⭐⭐ 最高でした", val:"5" },
      { label:"⭐⭐⭐⭐ 良かったです", val:"4" },
      { label:"⭐⭐⭐ 普通でした", val:"3" },
      { label:"⭐⭐ 少し残念でした", val:"2" },
    ], function(val) {
      surveyAnswers.stars = parseInt(val);
      patient.lastSurveyDate = new Date().toISOString();
      saveData("sakura_patient", patient);
      wait(function() { finishSurvey(); }, 400);
    });
  }, 600);
}

function finishSurvey() {
  if (surveyAnswers.stars >= 4) {
    addBot("アンケートにご協力いただきありがとうございます 🌸");
    wait(function() {
      addBot("口コミ文を作成しています...");
      // GASにGeminiで口コミ文生成を依頼
      fetch(GAS_URL, {
        method:"POST",
        body:JSON.stringify({ action:"generateReview", survey:surveyAnswers, patientName:patient.name }),
      })
      .then(function(r){return r.json();})
      .then(function(d){
        var msgs = document.getElementById("msgs");
        msgs.lastElementChild.remove();
        if (d.success) {
          addBot("口コミ文をご用意しました 🌸\nもちろん変更していただいて構いません。\nプレッシャーに感じないでくださいね。");
          wait(function() {
            var wrap = document.createElement("div");
            wrap.className = "cardwrap";
            wrap.innerHTML = '<div class="card"><h3>📝 口コミサンプル</h3>'
              + '<p style="font-size:13px;line-height:1.8;color:#374151;">' + esc(d.review) + '</p>'
              + '<div class="btnrow">'
              + '<a href="https://g.page/r/Cc0rd9i5x96tEAE/review" target="_blank" class="btnok" style="text-align:center;text-decoration:none;">投稿してみる 👉</a>'
              + '<button class="btnng" onclick="skipReview()">またの機会に</button>'
              + '</div></div>';
            document.getElementById("msgs").appendChild(wrap);
            scrollB();
          }, 400);
        } else {
          askPurpose();
        }
      });
    }, 800);
  } else {
    addBot("ご意見をお聞かせいただきありがとうございます 🌸\n今後の改善に活かしてまいります。");
    // スタッフに通知
    fetch(GAS_URL, {
      method:"POST",
      body:JSON.stringify({ action:"notifyStaff", type:"low_rating", survey:surveyAnswers, patient:patient.name }),
    });
    wait(function() { askPurpose(); }, 800);
  }
}

function skipReview() {
  addBot("またの機会にぜひお願いします 🌸");
  wait(function() { askPurpose(); }, 600);
}

function painLabel(n) {
  var labels = {1:"痛くない",2:"違和感",3:"少し違和感",4:"なんとなく痛い",5:"少し痛む",6:"痛い",7:"強い痛み",8:"かなり強い痛み",9:"耐えられない",10:"最大の痛み"};
  return labels[n] || "";
}

// ============================================================
// 来院目的
// ============================================================
function askPurpose() {
  showChoices([
    { label:"痛み・しびれがある", val:"pain" },
    { label:"疲れを回復したい", val:"fatigue" },
    { label:"トレーニングしたい", val:"training" },
    { label:"往診を希望したい", val:"visit" },
    { label:"その他", val:"other_purpose" },
  ], onPurpose);
}

function onPurpose(val) {
  reserv.purpose = val;
  if (val === "pain") {
    wait(function() {
      addBot("そうなんですね、それはつらいですね 🌸");
      wait(function() {
        addBot("どのあたりが痛みますか？");
        wait(function() {
          showChoices([
            { label:"腰・お尻", val:"back" },
            { label:"肩・首", val:"shoulder" },
            { label:"膝・足", val:"knee" },
            { label:"手・腕", val:"arm" },
            { label:"交通事故でのケガ", val:"accident" },
            { label:"その他", val:"other_location" },
          ], onLocation);
        }, 600);
      }, 600);
    }, 400);
  } else if (val === "fatigue") {
    wait(function() {
      addBot("お疲れが溜まっているんですね 🌸");
      wait(function() {
        addBot("どのようなケアをご希望ですか？");
        wait(function() {
          showChoices([
            { label:"酸素カプセルで回復したい", val:"酸素カプセル" },
            { label:"全身をほぐしたい", val:"施術30分" },
            { label:"相談しながら決めたい", val:"consult" },
          ], onMenuSelect);
        }, 600);
      }, 600);
    }, 400);
  } else if (val === "training") {
    wait(function() {
      addBot("トレーニングをお考えなんですね 🌸");
      wait(function() {
        addBot("どのようなトレーニングをご希望ですか？");
        wait(function() {
          showChoices([
            { label:"EMSで楽に鍛えたい（楽トレ）", val:"楽トレ" },
            { label:"マンツーマン指導を受けたい", val:"マンツーマントレーニング" },
            { label:"相談しながら決めたい", val:"consult" },
          ], onMenuSelect);
        }, 600);
      }, 600);
    }, 400);
  } else if (val === "visit") {
    wait(function() {
      addBot("往診をご希望なんですね 🌸");
      wait(function() {
        addBot("ご自宅の住所を教えていただけますか？\n（距離によって交通費が変わります）");
        step = "visit_address"; enableInput();
      }, 600);
    }, 400);
  } else {
    // その他：AIに意図を判定してもらう
    wait(function() {
      addBot("どのようなことでしょうか？\nお気軽にお話しください。");
      step = "other_free"; enableInput();
    }, 400);
  }
}

// ============================================================
// 痛みの場所
// ============================================================
function onLocation(val) {
  reserv.location = val;
  if (val === "accident") {
    wait(function() {
      addBot("交通事故でのお怪我ですね。大変でしたね 🌸");
      wait(function() {
        addBot("当院では交通事故施療にも対応しております。");
        reserv.menu = "初診（保険）";
        wait(function() { askDuration(); }, 600);
      }, 600);
    }, 400);
  } else if (val === "other_location") {
    wait(function() {
      addBot("どのあたりが痛みますか？");
      step = "location_free"; enableInput();
    }, 400);
  } else {
    wait(function() {
      addBot("いつ頃から痛みがありますか？");
      wait(function() { askDuration(); }, 600);
    }, 400);
  }
}

function askDuration() {
  showChoices([
    { label:"今日突然痛くなった", val:"today" },
    { label:"数日前から", val:"fewdays" },
    { label:"1週間以上前から", val:"week" },
    { label:"ずっと前から慢性的に", val:"chronic" },
  ], onDuration);
}

function onDuration(val) {
  reserv.duration = val;
  var msg, menu;
  if (val === "today") { msg = "急な痛みはつらいですね 😢\nまずしっかり診てもらいましょう。"; menu = "初診（保険）"; }
  else if (val === "fewdays") { msg = "数日続いているんですね。\n早めにケアしておくと安心ですよ 🌸"; menu = "初診（保険）"; }
  else if (val === "week") { msg = "1週間以上続いているんですね。\n一度しっかり時間をかけて診てもらいませんか？"; menu = "おすすめ初診"; }
  else { msg = "長い間お悩みだったんですね。\nそれはしんどかったですね 😢"; menu = "おすすめ初診"; }

  wait(function() {
    addBot(msg);
    wait(function() {
      addBot("「" + menu + "」をおすすめします。");
      wait(function() {
        showChoices([
          { label:"✅ " + menu + "で予約する", val:menu },
          { label:"他のメニューを見る", val:"consult" },
        ], onMenuSelect);
      }, 600);
    }, 600);
  }, 400);
}

// ============================================================
// メニュー選択
// ============================================================
function onMenuSelect(val) {
  if (val === "consult") {
    wait(function() {
      addBot("ご希望のメニューをお選びください。");
      wait(function() {
        showChoices([
          { label:"初診（保険）", val:"初診（保険）" },
          { label:"おすすめ初診（じっくり診察）", val:"おすすめ初診" },
          { label:"施術15分", val:"施術15分" },
          { label:"施術30分", val:"施術30分" },
          { label:"施術60分", val:"施術60分" },
          { label:"楽トレ", val:"楽トレ" },
          { label:"酸素カプセル", val:"酸素カプセル" },
          { label:"マンツーマントレーニング", val:"マンツーマントレーニング" },
        ], onMenuSelect);
      }, 600);
    }, 400);
    return;
  }
  reserv.menu = val;
  wait(function() {
    addBot("「" + val + "」ですね 🌸");
    wait(function() { askWho(); }, 600);
  }, 400);
}

// ============================================================
// 誰の予約か
// ============================================================
function askWho() {
  var choices = [{ label:"ご自身", val:"self" }];
  if (family.length > 0) {
    family.forEach(function(f, i) {
      choices.push({ label:f.name + "さん", val:"family_" + i });
    });
  }
  choices.push({ label:"家族・友人（新規登録）", val:"new_family" });
  addBot("ご予約はどなたのですか？");
  wait(function() { showChoices(choices, onWhoSelect); }, 600);
}

function onWhoSelect(val) {
  if (val === "self") {
    reserv.sei = patient.sei || ""; reserv.mei = patient.mei || "";
    reserv.seiKana = patient.seiKana || ""; reserv.meiKana = patient.meiKana || "";
    reserv.tel = patient.tel || "";
    if (patient.name) {
      wait(function() { askDate(); }, 400);
    } else {
      wait(function() {
        addBot("お名前を教えていただけますか？\n（例：山田 太郎）");
        step = "name"; enableInput();
      }, 400);
    }
  } else if (val === "new_family") {
    wait(function() {
      addBot("ご家族・お友達のお名前を教えていただけますか？\n（例：山田 花子）");
      step = "family_name"; enableInput();
    }, 400);
  } else {
    var idx = parseInt(val.replace("family_",""));
    var f = family[idx];
    reserv.sei = f.sei || ""; reserv.mei = f.mei || "";
    reserv.seiKana = f.seiKana || ""; reserv.meiKana = f.meiKana || "";
    reserv.tel = f.tel || patient.tel || "";
    wait(function() {
      addBot(f.name + "さんのご予約ですね 🌸");
      wait(function() { askDate(); }, 600);
    }, 400);
  }
}

// ============================================================
// 日付選択
// ============================================================
function askDate() {
  addBot("ご希望の日はいつですか？");
  wait(function() {
    var today = new Date();
    var dayNames = ["日","月","火","水","木","金","土"];
    var choices = [];
    for (var i=1;i<=8;i++) {
      var d = new Date(today); d.setDate(today.getDate()+i);
      if (d.getDay()===0) continue;
      var label = (d.getMonth()+1)+"月"+d.getDate()+"日（"+dayNames[d.getDay()]+"）";
      var val = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      choices.push({label:label,val:val});
    }
    choices.push({label:"他の日を入力する",val:"other_date"});
    showChoices(choices, onDateSelect);
  }, 600);
}

function onDateSelect(val) {
  if (val === "other_date") {
    wait(function() {
      addBot("ご希望の日付を入力してください。\n（例：2026-03-15）");
      step = "date"; enableInput();
    }, 400);
    return;
  }
  reserv.date = val;
  wait(function() { loadSlots(val); }, 400);
}

// ============================================================
// 空き時間
// ============================================================
function loadSlots(date) {
  showTyping();
  fetch(GAS_URL, {
    method:"POST",
    body:JSON.stringify({ action:"getSuggestedSlots", date:date, menu:reserv.menu }),
  })
  .then(function(r){return r.json();})
  .then(function(data){
    removeTyping();
    if (!data.success || data.slots.length===0) {
      addBot("申し訳ありません。その日は空きがありませんでした 😢");
      wait(function() { askDate(); }, 600);
      return;
    }
    addBot("空きがございます 🌸");
    wait(function() {
      addBot("ご希望の時間をお選びください。");
      wait(function() {
        var wrap = document.createElement("div");
        wrap.className = "slots";
        data.slots.slice(0,12).forEach(function(s){
          var btn = document.createElement("button");
          btn.className = "slotbtn"; btn.textContent = s;
          btn.onclick = function(){
            wrap.querySelectorAll("button").forEach(function(b){b.disabled=true;b.style.opacity="0.4";});
            onTimeSelect(s);
          };
          wrap.appendChild(btn);
        });
        document.getElementById("msgs").appendChild(wrap);
        scrollB();
      }, 600);
    }, 400);
  })
  .catch(function(){
    removeTyping();
    addBot("空き確認でエラーが発生しました。\nお電話（078-984-5788）でもご予約いただけます。","error");
  });
}

function onTimeSelect(time) {
  addUser(time);
  reserv.time = time;
  if (!reserv.tel && !patient.tel) {
    wait(function() {
      addBot("ご連絡先をお聞かせください 🌸");
      wait(function() {
        showChoices([
          { label:"📱 電話番号を入力する", val:"tel" },
          { label:"💚 LINEでお友達登録する", val:"line" },
        ], onContactSelect);
      }, 600);
    }, 400);
  } else {
    wait(function() { showConfirmCard(); }, 400);
  }
}

// ============================================================
// 連絡先
// ============================================================
function onContactSelect(val) {
  if (val === "tel") {
    wait(function() {
      addBot("電話番号を入力してください。\n（ハイフンなし・例：0789845788）");
      step = "tel"; enableInput();
    }, 400);
  } else {
    reserv.tel = "LINE登録";
    wait(function() {
      addBot("下のボタンからLINEお友達登録をお願いします 🌸");
      var wrap = document.createElement("div");
      wrap.className = "cardwrap";
      var btn = document.createElement("button");
      btn.className = "linebtn";
      btn.innerHTML = "💚 LINEでお友達登録する";
      btn.onclick = function(){ window.open(LINE_URL,"_blank"); };
      wrap.appendChild(btn);
      document.getElementById("msgs").appendChild(wrap);
      scrollB();
      wait(function() { showConfirmCard(); }, 800);
    }, 400);
  }
}

// ============================================================
// 予約確認カード
// ============================================================
function showConfirmCard() {
  addBot("ご予約内容を確認してください 🌸");
  wait(function() {
    var name = (reserv.sei||"")+" "+(reserv.mei||"");
    var kana = (reserv.seiKana||"")+" "+(reserv.meiKana||"");
    var wrap = document.createElement("div");
    wrap.className = "cardwrap";
    wrap.innerHTML = '<div class="card"><h3>📋 予約内容の確認</h3>'
      + row("お名前", name+"（"+kana+"）")
      + row("連絡先", reserv.tel||"")
      + row("メニュー", reserv.menu||"")
      + row("日時", (reserv.date||"")+" "+(reserv.time||""))
      + '<div class="btnrow">'
      + '<button class="btnok" onclick="confirmReservation()">この内容で予約する</button>'
      + '<button class="btnng" onclick="correctReservation()">訂正する</button>'
      + '</div></div>';
    document.getElementById("msgs").appendChild(wrap);
    scrollB();
  }, 400);
}

// ============================================================
// 訂正
// ============================================================
function correctReservation() {
  addBot("どこを訂正しますか？");
  wait(function() {
    showChoices([
      { label:"お名前", val:"fix_name" },
      { label:"フリガナ", val:"fix_kana" },
      { label:"連絡先", val:"fix_tel" },
      { label:"メニュー", val:"fix_menu" },
      { label:"日時", val:"fix_date" },
    ], onCorrect);
  }, 600);
}

function onCorrect(val) {
  if (val === "fix_name") {
    wait(function() { addBot("お名前を入力してください。"); step="name"; enableInput(); }, 400);
  } else if (val === "fix_kana") {
    wait(function() { addBot("フリガナを入力してください。"); step="kana"; enableInput(); }, 400);
  } else if (val === "fix_tel") {
    wait(function() { addBot("電話番号を入力してください。"); step="tel"; enableInput(); }, 400);
  } else if (val === "fix_menu") {
    wait(function() { onMenuSelect("consult"); }, 400);
  } else if (val === "fix_date") {
    wait(function() { askDate(); }, 400);
  }
}

// ============================================================
// 予約確定
// ============================================================
function confirmReservation() {
  addBot("予約の手続きをしています 🌸");
  showTyping();
  fetch(GAS_URL, {
    method:"POST",
    body:JSON.stringify(Object.assign({action:"makeReservation"},reserv)),
  })
  .then(function(r){return r.json();})
  .then(function(data){
    removeTyping();
    if (data.success) {
      // 患者情報を保存
      if (!patient.name && reserv.sei) {
        patient.sei = reserv.sei; patient.mei = reserv.mei;
        patient.seiKana = reserv.seiKana; patient.meiKana = reserv.meiKana;
        patient.name = reserv.sei+" "+reserv.mei;
        patient.tel = reserv.tel;
        saveData("sakura_patient", patient);
      }
      addBot("ご予約の手続きが完了しました 🌸\nご確認まで少々お待ちください。");
      // 30秒後に裏でカレンダー確認（GAS側で実装）
      wait(function() { askArrival(); }, 1000);
    } else {
      addBot("⚠️ 予約登録に問題が発生しました。\nお電話（078-984-5788）でご確認ください。","error");
    }
  });
}

// ============================================================
// 来院方法
// ============================================================
function askArrival() {
  addBot("ご来院の方法を教えてください。");
  wait(function() {
    showChoices([
      { label:"車で来る", val:"car" },
      { label:"徒歩・電車で来る", val:"walk" },
    ], onArrival);
  }, 600);
}

function onArrival(val) {
  if (val === "car") {
    wait(function() {
      addBot("どちら方面からお越しですか？");
      wait(function() {
        showChoices([
          { label:"神戸方面から", val:"kobe" },
          { label:"三田市方面から", val:"sanda" },
        ], onDirection);
      }, 600);
    }, 400);
  } else {
    wait(function() {
      addBot("どちら方面からお越しですか？");
      wait(function() {
        showChoices([
          { label:"神戸方面から", val:"kobe" },
          { label:"三田市方面から", val:"sanda" },
        ], onDirection);
      }, 600);
    }, 400);
  }
}

function onDirection(val) {
  var url = val === "kobe" ? YOUTUBE_KOBE : YOUTUBE_SANDA;
  var label = val === "kobe" ? "神戸方面" : "三田市方面";
  wait(function() {
    addBot(label + "からのルートをご案内します 🌸");
    wait(function() {
      var wrap = document.createElement("div");
      wrap.className = "cardwrap";
      var btn = document.createElement("a");
      btn.className = "ytbtn"; btn.href = url; btn.target = "_blank";
      btn.innerHTML = "▶ YouTubeでルートを確認する";
      wrap.appendChild(btn);
      document.getElementById("msgs").appendChild(wrap);
      scrollB();
      wait(function() { showFinalConfirm(); }, 1000);
    }, 600);
  }, 400);
}

// ============================================================
// 最終確認（裏でカレンダー確認済みの予約表示）
// ============================================================
function showFinalConfirm() {
  addBot("ご予約が確定しました ✅");
  wait(function() {
    var wrap = document.createElement("div");
    wrap.className = "cardwrap";
    wrap.innerHTML = '<div class="card"><h3>✅ 予約確定</h3>'
      + row("お名前", (reserv.sei||"")+" "+(reserv.mei||""))
      + row("メニュー", reserv.menu||"")
      + row("日時", (reserv.date||"")+" "+(reserv.time||""))
      + row("ご連絡先", reserv.tel||"")
      + '</div>';
    document.getElementById("msgs").appendChild(wrap);
    scrollB();
    wait(function() {
      addBot("当日はお気をつけてお越しください 🌸\nご不明な点はお電話（078-984-5788）までどうぞ。");
    }, 400);
  }, 400);
}

// ============================================================
// 往診
// ============================================================
function onVisitAddress(address) {
  reserv.visitAddress = address;
  addBot("距離を確認しています...");
  showTyping();
  fetch(GAS_URL, {
    method:"POST",
    body:JSON.stringify({ action:"calcDistance", address:address }),
  })
  .then(function(r){return r.json();})
  .then(function(data){
    removeTyping();
    var msgs = document.getElementById("msgs");
    msgs.lastElementChild.remove();
    if (data.success) {
      var km = data.distanceKm;
      var fee = 0;
      if (km >= 10) {
        fee = Math.ceil((km*2)/3)*1000;
      }
      if (fee > 0) {
        addBot("当院から約" + km + "kmですね。\n往復交通費として " + fee.toLocaleString() + "円が別途発生します。");
      } else {
        addBot("当院から約" + km + "kmですね。\n交通費は無料です 🌸");
      }
      reserv.visitFee = fee;
      reserv.menu = "往診";
      wait(function() {
        showChoices([
          { label:"この条件で予約する", val:"ok" },
          { label:"キャンセルする", val:"cancel" },
        ], function(val) {
          if (val === "ok") {
            wait(function() { askWho(); }, 400);
          } else {
            wait(function() {
              addBot("またのご利用をお待ちしております 🌸");
            }, 400);
          }
        });
      }, 600);
    } else {
      addBot("住所の確認ができませんでした。\nお電話（078-984-5788）でご相談ください。","error");
    }
  });
}

// ============================================================
// その他自由入力のAI判定
// ============================================================
function handleFreeInput(text) {
  showTyping();
  fetch(GAS_URL, {
    method:"POST",
    body:JSON.stringify({ action:"judgeIntent", text:text, reserv:reserv }),
  })
  .then(function(r){return r.json();})
  .then(function(data){
    removeTyping();
    addBot(data.reply);
    if (data.intent === "restart") {
      reserv = {}; step = "";
      wait(function() { askPurpose(); }, 800);
    } else if (data.intent === "correct") {
      wait(function() { correctReservation(); }, 800);
    } else if (data.intent === "symptom") {
      reserv.location = data.location || text;
      wait(function() { askDuration(); }, 800);
    } else if (data.intent === "menu") {
      wait(function() { onMenuSelect(data.menu || "consult"); }, 800);
    }
    // unknownの場合はそのまま会話継続
  });
}

// ============================================================
// テキスト送信
// ============================================================
function sendText() {
  var inp = document.getElementById("inp");
  var text = inp.value.trim();
  if (!text) return;
  addUser(text);
  inp.value = ""; inp.style.height = "auto";
  disableInput();

  if (step === "name") {
    step = "";
    var parts = text.trim().split(/[\s　]+/);
    reserv.sei = parts[0]||text; reserv.mei = parts[1]||"";
    wait(function() { addBot("フリガナを教えていただけますか？\n（例：ヤマダ タロウ）"); step="kana"; enableInput(); }, 400);

  } else if (step === "kana") {
    step = "";
    var kp = text.trim().split(/[\s　]+/);
    reserv.seiKana = kp[0]||text; reserv.meiKana = kp[1]||"";
    wait(function() {
      showChoices([
        { label:"📱 電話番号を入力する", val:"tel" },
        { label:"💚 LINEでお友達登録する", val:"line" },
      ], onContactSelect);
    }, 400);

  } else if (step === "tel") {
    step = ""; reserv.tel = text;
    wait(function() { showConfirmCard(); }, 400);

  } else if (step === "date") {
    step = ""; reserv.date = text;
    wait(function() { loadSlots(text); }, 400);

  } else if (step === "family_name") {
    step = "";
    var fp = text.trim().split(/[\s　]+/);
    var newFamily = { name:text.trim(), sei:fp[0]||text, mei:fp[1]||"", seiKana:"", meiKana:"", tel:"" };
    wait(function() {
      addBot("フリガナを教えていただけますか？");
      step = "family_kana";
      window._tmpFamily = newFamily;
      enableInput();
    }, 400);

  } else if (step === "family_kana") {
    step = "";
    var fkp = text.trim().split(/[\s　]+/);
    window._tmpFamily.seiKana = fkp[0]||text;
    window._tmpFamily.meiKana = fkp[1]||"";
    wait(function() {
      addBot("電話番号はありますか？\n（お持ちでない場合はスキップできます）");
      showChoices([
        { label:"入力する", val:"yes" },
        { label:"スキップ", val:"skip" },
      ], function(v) {
        if (v==="yes") { step="family_tel"; enableInput(); }
        else {
          if (family.length < 10) { family.push(window._tmpFamily); saveData("sakura_family",family); }
          reserv.sei = window._tmpFamily.sei; reserv.mei = window._tmpFamily.mei;
          reserv.seiKana = window._tmpFamily.seiKana; reserv.meiKana = window._tmpFamily.meiKana;
          reserv.tel = patient.tel||"";
          wait(function() { askDate(); }, 400);
        }
      });
    }, 400);

  } else if (step === "family_tel") {
    step = "";
    window._tmpFamily.tel = text;
    if (family.length < 10) { family.push(window._tmpFamily); saveData("sakura_family",family); }
    reserv.sei = window._tmpFamily.sei; reserv.mei = window._tmpFamily.mei;
    reserv.seiKana = window._tmpFamily.seiKana; reserv.meiKana = window._tmpFamily.meiKana;
    reserv.tel = text;
    wait(function() { askDate(); }, 400);

  } else if (step === "visit_address") {
    step = "";
    wait(function() { onVisitAddress(text); }, 400);

  } else if (step === "complaint") {
    step = "";
    fetch(GAS_URL, {
      method:"POST",
      body:JSON.stringify({ action:"notifyStaff", type:"complaint", message:text, patient:patient.name }),
    });
    wait(function() {
      addBot("ありがとうございます。必ずスタッフに伝えます 🌸");
      wait(function() { askPurpose(); }, 600);
    }, 400);

  } else if (step === "survey_symptom") {
    step = "";
    surveyAnswers.symptom = text;
    wait(function() { surveyQ2(); }, 400);

  } else if (step === "other_free" || step === "location_free") {
    step = "";
    handleFreeInput(text);

  } else {
    handleFreeInput(text);
  }
}

// ============================================================
// ユーティリティ
// ============================================================
function showChoices(choices, cb) {
  var wrap = document.createElement("div"); wrap.className = "choices";
  choices.forEach(function(c) {
    var btn = document.createElement("button"); btn.className = "cbtn"; btn.textContent = c.label;
    btn.onclick = function() {
      wrap.querySelectorAll("button").forEach(function(b){b.disabled=true;b.style.opacity="0.4";});
      addUser(c.label);
      setTimeout(function(){ cb(c.val, c.label); }, 400);
    };
    wrap.appendChild(btn);
  });
  document.getElementById("msgs").appendChild(wrap); scrollB();
}

function addBot(text, type) {
  var w = document.createElement("div"); w.className = "bw";
  w.innerHTML = '<div class="av">🌸</div><div class="bub bot '+(type||"")+'">'+esc(text)+'</div>';
  document.getElementById("msgs").appendChild(w); scrollB();
}
function addUser(text) {
  var w = document.createElement("div"); w.className = "bw user";
  w.innerHTML = '<div class="bub user">'+esc(text)+'</div>';
  document.getElementById("msgs").appendChild(w); scrollB();
}
function showTyping() {
  var el = document.createElement("div"); el.className = "bw"; el.id = "typing";
  el.innerHTML = '<div class="av">🌸</div><div class="typing-bub"><span></span><span></span><span></span></div>';
  document.getElementById("msgs").appendChild(el); scrollB();
}
function removeTyping() { var el = document.getElementById("typing"); if(el) el.remove(); }
function enableInput() {
  var i=document.getElementById("inp"), b=document.getElementById("sbtn");
  i.disabled=false; b.disabled=false; i.placeholder="メッセージを入力..."; i.focus();
}
function disableInput() {
  var i=document.getElementById("inp"), b=document.getElementById("sbtn");
  i.disabled=true; b.disabled=true; i.placeholder="上の選択肢からお選びください";
}
function scrollB() { var m=document.getElementById("msgs"); m.scrollTop=m.scrollHeight; }
function esc(t) { return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function wait(fn,ms) { setTimeout(fn,ms||400); }
function pad(n) { return ("0"+n).slice(-2); }
function row(l,v) { return '<div class="row"><span class="lbl">'+l+'</span><span>'+esc(v)+'</span></div>'; }
function saveData(k,v) { try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function loadData(k) { try{var d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch(e){return null;} }

document.getElementById("inp").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}
});
document.getElementById("inp").addEventListener("input",function(){
  this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,80)+"px";
});
</script>
