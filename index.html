// 患者検索
function adminSearchPatient() {
  var name = (document.getElementById("adm-name")||{}).value||"";
  var kana = (document.getElementById("adm-kana")||{}).value||"";
  var tel  = (document.getElementById("adm-tel")||{}).value||"";
  var cno  = (document.getElementById("adm-cno")||{}).value||"";
  name = name.trim(); kana = kana.trim();
  tel = tel.trim().replace(/-/g,""); cno = cno.trim();

  var msg = document.getElementById("adm-search-msg");
  if (!name && !kana && !tel && !cno) {
    msg.innerHTML = '<span style="color:#f87171;font-size:13px;">いずれかの項目を入力してください</span>';
    return;
  }
  msg.innerHTML = '<span style="color:#6b7280;font-size:13px;">検索中...</span>';

  fetch(GAS_URL, { method:"POST", body:JSON.stringify({
    token:AUTH_TOKEN, action:"searchPatient", name:name, kana:kana, tel:tel, customerNo:cno
  })})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!d.success) {
      var errMsg = d.message || "検索エラーが発生しました";
      msg.innerHTML = '<span style="color:#f87171;font-size:13px;">⚠️ ' + esc(errMsg) + '</span>';
      return;
    }
    if (!d.found) {
      msg.innerHTML = '<span style="color:#f87171;font-size:13px;">患者が見つかりませんでした（条件を変えてお試しください）</span>';
      return;
    }

    var patients = d.patients || [d];
    var panel = document.getElementById("admin-panel");

    if (patients.length === 1) {
      // 1件→そのまま表示
      msg.innerHTML = '<span style="color:#059669;font-size:13px;">✅ 1件見つかりました</span>';
      _adminFoundPatient = patients[0];
      _adminReservations = [];
      renderAdminPatientCard(panel, patients[0]);
    } else {
      // 複数件→候補リストを表示して選択させる
      msg.innerHTML = '<span style="color:#059669;font-size:13px;">✅ ' + patients.length + '件見つかりました。選んでください</span>';
      // 既存カードを削除
      var old = document.getElementById("adm-patient-card");
      if (old) old.remove();
      // 候補リスト描画
      var list = document.createElement("div");
      list.id = "adm-patient-card";
      list.style.cssText = "margin-top:12px;";
      var html = '<div class="admin-result">';
      patients.forEach(function(p, i) {
        var pname = ((p.sei||"") + " " + (p.mei||"")).trim() || p.name || "";
        var pkana = ((p.seiKana||"") + " " + (p.meiKana||"")).trim();
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #dbeafe;">'
          + '<div>'
          + '<div style="font-weight:600;color:#1e40af;font-size:13px;">👤 ' + esc(pname) + '</div>'
          + '<div style="font-size:11px;color:#6b7280;">' + esc(pkana) + '　No.' + esc(p.customerNo||"") + '　' + esc(p.tel||"") + '</div>'
          + '</div>'
          + '<button class="admin-btn" style="padding:6px 12px;font-size:12px;" onclick="adminSelectPatient(' + i + ')">選択</button>'
          + '</div>';
      });
      html += '</div>';
      list.innerHTML = html;
      list._patients = patients;
      var ss2 = document.getElementById("adm-search-sec");
      if (ss2 && ss2.parentNode === panel) { panel.insertBefore(list, ss2.nextSibling); }
      else { panel.appendChild(list); }
    }
  })
  .catch(function(){
    msg.innerHTML = '<span style="color:#f87171;font-size:13px;">通信エラーが発生しました</span>';
  });
}

function adminSelectPatient(idx) {
  var card = document.getElementById("adm-patient-card");

  var p = patients[idx];

// 予約確認
function adminShowReservations() {
  var area = document.getElementById("adm-action-area");

  if (!d) return;
  area.innerHTML = '<p style="font-size:13px;color:#6b7280;padding:8px 0;">予約を取得中...</p>';

  fetch(GAS_URL, { method:"POST", body:JSON.stringify({
    token:AUTH_TOKEN, action:"getUpcomingReservations",
    sei:d.sei||"", mei:d.mei||"", seiKana:d.seiKana||"", meiKana:d.meiKana||"", tel:d.tel||""
  })})
  .then(function(r){ return r.json(); })
  .then(function(res){
    if (!res.success || !res.reservations || res.reservations.length === 0) {
      area.innerHTML = '<p style="font-size:13px;color:#6b7280;padding:8px 0;">今後の予約はありません</p>';
      return;
    }
    _adminReservations = res.reservations;
    var days = ["日","月","火","水","木","金","土"];
    var html = '<div class="admin-result">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
      + '<div style="font-size:12px;color:#1e40af;font-weight:700;">今後の予約（' + res.reservations.length + '件）</div>'
      + '<label style="font-size:11px;color:#6b7280;cursor:pointer;"><input type="checkbox" id="adm-chk-all" onchange="adminToggleAllChk(this.checked)" style="margin-right:4px;">全選択</label>'
      + '</div>';
    res.reservations.forEach(function(r, i){
      var dt = new Date(r.date + "T00:00:00");
      var dlabel = (dt.getMonth()+1)+"月"+dt.getDate()+"日（"+days[dt.getDay()]+"） "+r.time;
      html += '<div class="arow" style="align-items:center;">'
        + '<label style="display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;">'
        + '<input type="checkbox" class="adm-rv-chk" data-idx="'+i+'" style="width:16px;height:16px;accent-color:#ef4444;">'
        + '<span class="albl" style="margin:0;">' + esc(dlabel) + ' ' + esc(r.menu) + '</span>'
        + '</label>'
        + '<button class="admin-btn red" style="padding:3px 8px;font-size:11px;flex-shrink:0;" onclick="adminCancelOne('+i+')">取消</button>'
        + '</div>';
    });
    html += '<button class="admin-btn red" style="width:100%;padding:10px;margin-top:10px;font-size:13px;" onclick="adminCancelSelected()">🗑️ 選択した予約を一括取消</button>'
      + '</div>';
    area.innerHTML = html;
  })
  .catch(function(){
    area.innerHTML = '<p style="font-size:13px;color:#f87171;">通信エラーが発生しました</p>';
  });
}

function adminCancelOne(idx) {
  var r = _adminReservations[idx];
  if (!r) return;
  if (!confirm(r.date + " " + r.time + "「" + r.menu + "」をキャンセルしますか？")) return;
  fetch(GAS_URL, { method:"POST", body:JSON.stringify({
    token:AUTH_TOKEN, action:"cancelReservation",
    numericId:r.numericId||"", eventId:r.eventId||"", date:r.date, time:r.time, calendar:r.calendar||"リピッテ予約"
  })})
  .then(function(r2){ return r2.json(); })
  .then(function(d){
    if (d.success) {
      _adminReservations.splice(idx, 1);
      adminShowReservations();
    } else {
      alert("キャンセル失敗: " + (d.message||"エラー"));
    }
  });
}

function adminToggleAllChk(checked) {
  document.querySelectorAll(".adm-rv-chk").forEach(function(el){ el.checked = checked; });
}

function adminCancelSelected() {
  var checked = Array.from(document.querySelectorAll(".adm-rv-chk:checked"));
  if (checked.length === 0) { alert("取消する予約を選択してください"); return; }
  var idxs = checked.map(function(el){ return parseInt(el.getAttribute("data-idx")); }).sort(function(a,b){return b-a;});
  var labels = idxs.map(function(i){ var r=_adminReservations[i]; return r.date+" "+r.time+"「"+r.menu+"」"; });
  if (!confirm("以下の予約を取消しますか？\n\n" + labels.join("\n"))) return;
  var area = document.getElementById("adm-action-area");
  if (area) area.innerHTML = '<p style="font-size:13px;color:#6b7280;padding:8px 0;">取消処理中...</p>';
  var promises = idxs.map(function(i){
    var r = _adminReservations[i];
    return fetch(GAS_URL, { method:"POST", body:JSON.stringify({
      token:AUTH_TOKEN, action:"cancelReservation",
      numericId:r.numericId||"", eventId:r.eventId||"", date:r.date, time:r.time, calendar:r.calendar||"リピッテ予約"
    })}).then(function(res){ return res.json(); });
  });
  Promise.all(promises).then(function(results){
    var failed = results.filter(function(d){ return !d.success; });
    idxs.forEach(function(i){ _adminReservations[i] = null; });
    _adminReservations = _adminReservations.filter(function(r){ return r !== null; });
    if (failed.length > 0) { alert(failed.length + "件の取消に失敗しました"); }
    adminShowReservations();
  });
}

    showChoices([
      { label:"📅 通常予約",                   val:"normal"  },

        wait(function(){ askRegularMenu(); }, 400);

var MEMO_KEY = "sakura_debug_memos";

function loadMemos() {
  return loadData(MEMO_KEY) || [];
}

function saveMemos(memos) {
  saveData(MEMO_KEY, memos);
  renderMemoList();
  updateMemoBadge();
  // GASスプレッドシートへ同期（エラーは無視）
  fetch(GAS_URL, { method:"POST", body:JSON.stringify({ token:AUTH_TOKEN, action:"saveMemos", memos:memos }) }).catch(function(){});
}

function updateMemoBadge() {
  var memos = loadMemos();
  var badge = document.getElementById("memo-count");
  if (!badge) return;
  if (memos.length > 0) {
    badge.textContent = memos.length;
    badge.style.display = "flex";
  } else {
    badge.style.display = "none";
  }
}

function toggleMemoPanelOpen() {
  var panel = document.getElementById("memo-panel");
  if (panel.classList.contains("open")) {
    panel.classList.remove("open");
  } else {
    panel.classList.add("open");
    renderMemoList();
    setTimeout(function(){ document.getElementById("memo-inp").focus(); }, 200);
  }
}

function onMemoPanelBg(e) {
  if (e.target === document.getElementById("memo-panel")) toggleMemoPanelOpen();
}

function addMemoItem() {
  var inp = document.getElementById("memo-inp");
  var text = inp.value.trim();
  if (!text) return;
  // 明らかなテスト入力・短すぎる入力はスキップ
  var testPatterns = /^(あ+|test|てすと|テスト|ok|OK|はい|いいえ|a+|ー+|…+|\.+|,+)$/i;
  if (text.length < 5 || testPatterns.test(text)) {
    inp.value = "";
    var hint = document.getElementById("memo-hint");
    if (hint) { hint.style.display = "block"; setTimeout(function(){ hint.style.display = "none"; }, 3000); }
    return;
  }
  var memos = loadMemos();
  var now = new Date();
  var ts = (now.getMonth()+1) + "/" + now.getDate() + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
  // 自動コンテキスト取得
  var stepLabel = (typeof step !== "undefined" && step) ? step : "（開始前）";
  var lastBotMsg = "";
  var bots = document.querySelectorAll("#msgs .bub.bot");
  if (bots.length) lastBotMsg = bots[bots.length-1].textContent.trim().substring(0, 40);
  var ctx = "📍" + stepLabel + (lastBotMsg ? " ／ 直前：「" + lastBotMsg + "…」" : "");
  memos.unshift({ text: text, ts: ts, ctx: ctx, id: Date.now() });
  saveMemos(memos);
  inp.value = "";
  inp.focus();
}

function deleteMemoItem(id) {
  var memos = loadMemos().filter(function(m){ return m.id !== id; });
  saveMemos(memos);
}

function clearAllMemos() {
  if (!confirm("すべてのメモを削除しますか？")) return;
  saveMemos([]);
}

function copyAllMemos() {
  var memos = loadMemos();
  if (memos.length === 0) { alert("メモがありません"); return; }
  var text = "【不具合・改善メモ】\n\n" + memos.map(function(m, i){
    return (i+1) + ". [" + m.ts + "] " + (m.ctx || "") + "\n" + m.text;
  }).join("\n\n");
  navigator.clipboard.writeText(text).then(function(){
    var btn = document.querySelector(".memo-copy-btn");
    var orig = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "✓ コピー完了"; setTimeout(function(){ btn.textContent = orig; }, 2000); }
  }).catch(function(){ alert("コピーに失敗しました"); });
}

function renderMemoList() {
  var list = document.getElementById("memo-list");
  if (!list) return;
  var memos = loadMemos();
  if (memos.length === 0) {
    list.innerHTML = '<div class="memo-empty">メモはまだありません 📝<br><span style="font-size:12px;">気になった点をどんどん記録してください</span></div>';
    return;
  }
  var html = memos.map(function(m){
    var isDone = m.status === 'done';
    return '<div class="memo-item' + (isDone ? ' done' : '') + '">'
      + (isDone ? '<div class="memo-done-badge">✅ 修正済み</div>' : '')
      + '<button class="memo-item-del" onclick="deleteMemoItem(' + m.id + ')">✕</button>'
      + '<div class="memo-item-text">' + esc(m.text) + '</div>'
      + '<div class="memo-item-meta">🕐 ' + esc(m.ts) + (m.ctx ? '<br>' + esc(m.ctx) : '') + '</div>'
      + '</div>';
  }).join("");
  html += '<button class="memo-clear-btn" onclick="clearAllMemos()">🗑 すべて削除</button>';
  list.innerHTML = html;
}

// メモ入力欄でCtrl+Enterで追加
document.getElementById("memo-inp").addEventListener("keydown", function(e){
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); addMemoItem(); }
});

// GASのpending一覧と照合してdone状態を同期
function syncMemoStatus() {
  fetch(GAS_URL + '?action=memoStatus')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var serverMemos = d.memos || [];
      var pendingIds = serverMemos.map(function(m){ return String(m.id); });
      var memos = loadMemos();
      var localIds = memos.map(function(m){ return String(m.id); });
      var changed = false;

      // 既存ローカルメモのdone/pending状態を更新
      memos.forEach(function(m){
        var newStatus = (pendingIds.indexOf(String(m.id)) !== -1) ? 'pending' : 'done';
        if (m.status !== newStatus) { m.status = newStatus; changed = true; }
      });

      // サーバーにあってローカルにないメモを追加（他PCで書いたメモを同期）
      serverMemos.forEach(function(sm){
        if (localIds.indexOf(String(sm.id)) === -1) {
          memos.push({ text: sm.text, ts: sm.ts, ctx: sm.ctx || "", id: sm.id, status: 'pending' });
          changed = true;
        }
      });

      if (changed) { saveData(MEMO_KEY, memos); renderMemoList(); updateMemoBadge(); }
    })
    .catch(function(){});
}

// 初期化（バッジ更新＋サイドパネル初期表示＋GASとdone状態同期）
updateMemoBadge();
renderMemoList();
syncMemoStatus();

</script>
</body>
</html>
