<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サクラ整骨院 - AI予約チャット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e8839a;
    --pink-light: #fde8ee;
    --pink-dark: #c45d75;
    --pink-pale: #fff5f7;
    --gray: #6b7280;
    --text: #1f2937;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(135deg,#fff5f7 0%,#fde8ee 50%,#fff0f3 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .chat-wrapper {
    width:100%; max-width:480px; background:white; border-radius:24px;
    box-shadow:0 8px 40px rgba(232,131,154,0.2); overflow:hidden;
    display:flex; flex-direction:column; height:90vh; max-height:800px;
  }
  .chat-header {
    background:linear-gradient(135deg,var(--pink) 0%,var(--pink-dark) 100%);
    padding:18px 24px; color:white; display:flex; align-items:center; gap:14px; flex-shrink:0;
  }
  .header-icon {
    width:46px; height:46px; background:rgba(255,255,255,0.2); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .header-text h1 { font-family:'Shippori Mincho',serif; font-size:16px; font-weight:600; letter-spacing:0.05em; }
  .header-text p { font-size:12px; opacity:0.85; margin-top:2px; }
  .header-status { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.9; }
  .status-dot { width:8px; height:8px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .chat-messages {
    flex:1; overflow-y:auto; padding:20px 16px;
    display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth;
  }
  .chat-messages::-webkit-scrollbar { width:4px; }
  .chat-messages::-webkit-scrollbar-thumb { background:#f9a8b8; border-radius:4px; }

  .bubble-wrap { display:flex; gap:8px; animation:fadeUp 0.3s ease; }
  .bubble-wrap.user { flex-direction:row-reverse; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .bot-avatar {
    width:32px; height:32px; background:var(--pink-light); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:4px;
  }
  .bubble {
    max-width:75%; padding:12px 16px; border-radius:18px; font-size:14px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word;
  }
  .bubble.bot { background:var(--pink-light); color:var(--text); border-top-left-radius:4px; }
  .bubble.user { background:var(--pink); color:white; border-top-right-radius:4px; }
  .bubble.error { background:#fee2e2; color:#dc2626; }

  .reservation-card {
    background:linear-gradient(135deg,#fff5f7,#fde8ee);
    border:2px solid var(--pink-light); border-radius:16px;
    padding:16px; margin-top:8px; font-size:13px;
  }
  .reservation-card h3 { color:var(--pink-dark); font-size:14px; margin-bottom:10px; }
  .reservation-card .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #fce4ec; }
  .reservation-card .row:last-of-type { border-bottom:none; }
  .reservation-card .label { color:var(--gray); }
  .reservation-card .value { font-weight:500; color:var(--text); }
  .confirm-buttons { display:flex; gap:8px; margin-top:12px; }
  .btn-confirm { flex:1; padding:10px; background:var(--pink); color:white; border:none; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn-confirm:hover { background:var(--pink-dark); }
  .btn-cancel { flex:1; padding:10px; background:white; color:var(--gray); border:1px solid #e5e7eb; border-radius:12px; font-size:14px; cursor:pointer; }

  .slots-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .slot-btn {
    padding:6px 14px; background:white; border:1.5px solid var(--pink);
    border-radius:20px; font-size:13px; color:var(--pink-dark); cursor:pointer;
  }
  .slot-btn:hover { background:var(--pink-light); }

  .typing { display:flex; gap:4px; align-items:center; padding:4px 0; }
  .typing span { width:7px; height:7px; background:var(--pink); border-radius:50%; animation:bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay:0.2s; }
  .typing span:nth-child(3) { animation-delay:0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  .chat-input-area {
    padding:12px 16px; border-top:1px solid #fce4ec; background:white; flex-shrink:0;
  }
  .input-wrap { display:flex; gap:8px; align-items:center; }
  .chat-input {
    flex:1; border:1.5px solid #fce4ec; border-radius:24px; padding:10px 16px;
    font-size:14px; font-family:inherit; outline:none; resize:none;
    max-height:100px; overflow-y:auto; line-height:1.5;
  }
  .chat-input:focus { border-color:var(--pink); }
  .send-btn {
    width:40px; height:40px; background:var(--pink); border:none; border-radius:50%;
    color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background 0.2s;
  }
  .send-btn:hover { background:var(--pink-dark); }
  .send-btn:disabled { background:#f3c4cf; cursor:not-allowed; }
</style>
</head>
<body>
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="header-icon">🌸</div>
    <div class="header-text">
      <h1>サクラ整骨院</h1>
      <p>AI予約アシスタント</p>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      受付中
    </div>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input-area">
    <div class="input-wrap">
      <textarea class="chat-input" id="userInput" placeholder="メッセージを入力..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbyfHn9LJJMs7KQNi0rxTVUTwvOlma_VwM8sXdabL693gx9h1xguR-vibe3D8MbZseR6/exec";
var conversationHistory = [];
var pendingReservation = null;

window.onload = function() {
  addBotMsg("こんにちは！サクラ整骨院のAIアシスタントです 🌸\n今日はどのようなお悩みでいらっしゃいますか？\n症状をお気軽にお話しください。");
};

function sendMessage() {
  var input = document.getElementById("userInput");
  var text = input.value.trim();
  if (!text) return;

  addUserMsg(text);
  input.value = "";
  input.style.height = "auto";
  setSendDisabled(true);
  showTyping();

  conversationHistory.push({ role: "user", parts: [{ text: text }] });

  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ action: "chat", contents: conversationHistory }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    removeTyping();
    setSendDisabled(false);

    if (!data.success || !data.gemini || data.gemini.error) {
      addBotMsg("⚠️ AIとの通信でエラーが発生しました。\nお電話（078-984-5788）でもご予約いただけます。", "error");
      return;
    }

    var rawText = data.gemini.candidates[0].content.parts[0].text;
    conversationHistory.push({ role: "model", parts: [{ text: rawText }] });

    var resMatch = rawText.match(/<RESERVATION_DATA>([\s\S]*?)<\/RESERVATION_DATA>/);
    if (resMatch) {
      var displayText = rawText.replace(/<RESERVATION_DATA>[\s\S]*?<\/RESERVATION_DATA>/, "").trim();
      if (displayText) addBotMsg(displayText);
      try {
        pendingReservation = JSON.parse(resMatch[1].trim());
        checkAndShowConfirm(pendingReservation);
      } catch(e) {
        addBotMsg("予約情報の解析に失敗しました。もう一度お試しください。");
      }
    } else {
      addBotMsg(rawText);
    }
  })
  .catch(function() {
    removeTyping();
    setSendDisabled(false);
    addBotMsg("⚠️ 通信エラーが発生しました。\nお電話（078-984-5788）でもご予約いただけます。", "error");
  });
}

function checkAndShowConfirm(res) {
  showTyping();
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ action: "checkAvailability", date: res.date, time: res.time, menu: res.menu }),
  })
  .then(function(r) { return r.json(); })
  .then(function(avail) {
    removeTyping();
    if (!avail.available) {
      addBotMsg("申し訳ありません。" + res.date + " " + res.time + "は" + avail.message + "\n他の時間帯をご案内します。");
      showSlotSuggestions(res.date, res.menu);
      return;
    }
    showReservationCard(res, avail.endTime);
  });
}

function showReservationCard(res, endTime) {
  var card = document.createElement("div");
  card.className = "bubble-wrap";
  card.id = "reservationCard";
  card.innerHTML = '<div class="bot-avatar">🌸</div>'
    + '<div class="bubble bot"><div class="reservation-card">'
    + '<h3>📋 予約内容の確認</h3>'
    + '<div class="row"><span class="label">お名前</span><span class="value">' + res.sei + ' ' + res.mei + '（' + res.seiKana + ' ' + res.meiKana + '）</span></div>'
    + '<div class="row"><span class="label">電話番号</span><span class="value">' + res.tel + '</span></div>'
    + '<div class="row"><span class="label">メニュー</span><span class="value">' + res.menu + '</span></div>'
    + '<div class="row"><span class="label">日時</span><span class="value">' + res.date + ' ' + res.time + '〜' + endTime + '</span></div>'
    + '<div class="confirm-buttons">'
    + '<button class="btn-confirm" onclick="confirmReservation()">この内容で予約する</button>'
    + '<button class="btn-cancel" onclick="cancelReservation()">変更する</button>'
    + '</div></div></div>';
  document.getElementById("messages").appendChild(card);
  scrollToBottom();
}

function showSlotSuggestions(date, menu) {
  showTyping();
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ action: "getSuggestedSlots", date: date, menu: menu }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    removeTyping();
    if (!data.success || data.slots.length === 0) {
      addBotMsg("申し訳ありません。" + date + "は空き枠がありません。\n別の日付をお知らせください。");
      return;
    }
    var slots = data.slots.slice(0, 8);
    var wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    var btns = slots.map(function(s) {
      return '<button class="slot-btn" onclick="selectSlot(\'' + date + '\',\'' + s + '\')">' + s + '</button>';
    }).join("");
    wrap.innerHTML = '<div class="bot-avatar">🌸</div><div class="bubble bot">'
      + date + 'の空き時間です。ご希望の時間をお選びください。'
      + '<div class="slots-wrap">' + btns + '</div></div>';
    document.getElementById("messages").appendChild(wrap);
    scrollToBottom();
  });
}

function selectSlot(date, time) {
  if (!pendingReservation) return;
  pendingReservation.date = date;
  pendingReservation.time = time;
  addUserMsg(date + " " + time + "を選択");
  var card = document.getElementById("reservationCard");
  if (card) card.remove();
  checkAndShowConfirm(pendingReservation);
}

function confirmReservation() {
  if (!pendingReservation) return;
  setSendDisabled(true);
  showTyping();

  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify(Object.assign({ action: "makeReservation" }, pendingReservation)),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    removeTyping();
    setSendDisabled(false);
    if (data.success) {
      addBotMsg("✅ ご予約が完了しました！\n\n📅 " + data.date + " " + data.time + "〜" + data.endTime
        + "\n🌸 " + data.menu + "\n\n当日はお気をつけてお越しください。\nご不明な点はお電話（078-984-5788）までどうぞ。");
      pendingReservation = null;
    } else {
      addBotMsg("⚠️ 予約の登録に失敗しました。\n" + data.message + "\nお電話（078-984-5788）でもご予約いただけます。", "error");
    }
  });
}

function cancelReservation() {
  pendingReservation = null;
  var card = document.getElementById("reservationCard");
  if (card) card.remove();
  addBotMsg("予約内容を変更しますね。\nご希望の日時やメニューをお知らせください。");
}

function addBotMsg(text, type) {
  var wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  wrap.innerHTML = '<div class="bot-avatar">🌸</div>'
    + '<div class="bubble bot ' + (type || "") + '">' + escapeHtml(text) + '</div>';
  document.getElementById("messages").appendChild(wrap);
  scrollToBottom();
}

function addUserMsg(text) {
  var wrap = document.createElement("div");
  wrap.className = "bubble-wrap user";
  wrap.innerHTML = '<div class="bubble user">' + escapeHtml(text) + '</div>';
  document.getElementById("messages").appendChild(wrap);
  scrollToBottom();
}

function showTyping() {
  var el = document.createElement("div");
  el.className = "bubble-wrap";
  el.id = "typing";
  el.innerHTML = '<div class="bot-avatar">🌸</div><div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById("messages").appendChild(el);
  scrollToBottom();
}

function removeTyping() {
  var el = document.getElementById("typing");
  if (el) el.remove();
}

function setSendDisabled(flag) {
  document.getElementById("sendBtn").disabled = flag;
}

function scrollToBottom() {
  var msgs = document.getElementById("messages");
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}

document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 100) + "px";
});
</script>
</body>
</html>
